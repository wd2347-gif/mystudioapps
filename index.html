<style>
  /* 어두운 화면 하나(지금 사이트와 같은 색). */
  :root {
    color-scheme: dark;
    --bg: #0E110D; --surface: #171B16; --surface-2: #1E231D; --ink: #F1F3EE; --ink-soft: #9BA49A; --ink-faint: #6E776D;
    --line: #2A3129; --green: #43D873; --wash: rgba(67, 216, 115, .12);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Pretendard", -apple-system, "Apple SD Gothic Neo", "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.55;
  }
  a { color: var(--green); }
  html:lang(ko) body { word-break: keep-all; overflow-wrap: anywhere; }
  .intro p, .desc, .feature p, footer .foot-copy { text-wrap: pretty; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }

  /* ── 머리글 ── */
  header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 20px; padding-bottom: 20px; }
  .brand { font-weight: 800; font-size: 20px; letter-spacing: -.01em; color: var(--ink); text-decoration: none; }
  .brand span { color: var(--green); }
  .langs { display: flex; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .langs button {
    border: 0; background: transparent; color: var(--ink-soft); font: inherit; font-size: 13px; font-weight: 600;
    padding: 5px 11px; border-radius: 999px; cursor: pointer;
  }
  .langs button[aria-pressed="true"] { background: var(--wash); color: var(--green); }

  /* ── 첫 화면: 소개 한 줄 + 분류 ── */
  .intro { padding: 12px 0 4px; }
  .intro h1 { margin: 0; font-size: 34px; line-height: 1.25; letter-spacing: -.025em; font-weight: 800; }
  .intro h1 em { font-style: normal; color: var(--green); }
  .intro p { margin: 8px 0 0; color: var(--ink-soft); font-size: 16px; }
  .chips { display: flex; gap: 8px; margin: 22px 0 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft);
    font: inherit; font-size: 14px; font-weight: 600; padding: 7px 14px; border-radius: 999px; cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  .group { margin-top: 26px; }
  .group h2 { margin: 0 0 12px; font-size: 13px; font-weight: 700; color: var(--ink-soft); letter-spacing: .04em; display: flex; align-items: center; gap: 8px; }
  .group h2 .n { color: var(--ink-faint); font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }

  /* ── 앱 카드: 카드 전체가 소개로 가는 링크, 스토어 단추만 따로 ── */
  .card {
    position: relative; display: flex; flex-direction: column; gap: 14px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 18px;
    transition: border-color .15s, background .15s;
  }
  .card:hover { border-color: #3D473C; background: var(--surface-2); }
  .card .top { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .card img.ic { width: 60px; height: 60px; border-radius: 14px; flex: none; background: var(--surface-2); }
  .card .txt { min-width: 0; flex: 1; }
  .card h3 { margin: 0; font-size: 17px; line-height: 1.3; letter-spacing: -.01em; }
  .card h3 a { color: var(--ink); text-decoration: none; }
  .card h3 a::after { content: ""; position: absolute; inset: 0; border-radius: 22px; }  /* 카드 전체를 누를 수 있게 */
  .card h3 a:focus-visible { outline: none; }
  .card:focus-within { border-color: var(--green); }
  .card .sub { margin: 2px 0 0; color: var(--ink-soft); font-size: 13.5px; line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .cat { display: inline-block; margin-top: 6px; font-size: 11.5px; font-weight: 600; color: var(--ink-faint); }
  .card .go { flex: none; color: var(--ink-faint); font-size: 20px; line-height: 1; }
  .card .dl { margin-top: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; position: relative; z-index: 1; }
  .card.soon img.ic { opacity: .8; }
  .pill.mini { display: none; }

  .store {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 40px; padding: 8px 12px; border-radius: 12px;
    background: var(--ink); color: var(--bg); text-decoration: none; font-weight: 700; font-size: 14px; white-space: nowrap;
  }
  .store:hover { background: #fff; }
  .store svg { width: 17px; height: 17px; fill: currentColor; flex: none; }
  .store.soon { background: transparent; color: var(--ink-faint); border: 1px dashed var(--line); font-weight: 600; font-size: 13px; cursor: default; }
  .pill {
    grid-column: 1 / -1; justify-self: start; display: inline-flex; align-items: center; gap: 6px;
    min-height: 32px; padding: 5px 12px; border-radius: 999px; background: var(--wash); color: var(--green); font-size: 13px; font-weight: 700;
  }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  /* ── 앱 소개(#앱) ── */
  .back { display: inline-flex; align-items: center; gap: 6px; margin: 4px 0 16px; color: var(--ink-soft); text-decoration: none; font-weight: 600; font-size: 15px;
    padding: 7px 14px 7px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
  .back:hover { color: var(--ink); }
  .hero {
    background: var(--surface); border: 1px solid var(--line); border-radius: 28px; padding: 32px;
    display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 28px; align-items: center;
  }
  .hero img.icon { width: 120px; height: 120px; border-radius: 27px; }
  .hero h1 { margin: 0; font-size: 34px; line-height: 1.2; letter-spacing: -.02em; }
  .tagline { margin: 6px 0 10px; font-size: 20px; font-weight: 700; color: var(--green); }
  .desc { margin: 0 0 18px; color: var(--ink-soft); }
  .stores { display: flex; flex-wrap: wrap; gap: 10px; }
  .stores .store { padding: 10px 18px; min-height: 44px; }
  .more-link { display: inline-block; margin-top: 14px; font-weight: 600; text-decoration: none; }

  .features { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin: 16px 0; }
  .feature { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 22px; }
  .feature .emoji { font-size: 24px; }
  .feature h3 { margin: 8px 0 4px; font-size: 17px; }
  .feature p { margin: 0; color: var(--ink-soft); font-size: 14px; }

  .shots-wrap { position: relative; }
  .shots { display: flex; gap: 14px; overflow-x: auto; padding: 4px 2px 12px; scroll-snap-type: x mandatory; scroll-behavior: smooth; scrollbar-width: none; }
  .shots::-webkit-scrollbar { display: none; }
  .shots.dragging { scroll-snap-type: none; scroll-behavior: auto; cursor: grabbing; }
  .shots img { user-select: none; -webkit-user-drag: none; width: 200px; height: auto; border-radius: 22px; border: 1px solid var(--line); flex: none; scroll-snap-align: start; background: var(--surface); }
  .shot-nav {
    position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer;
    display: none; place-items: center; font-size: 22px; line-height: 1;
  }
  .shot-nav.prev { left: -14px; } .shot-nav.next { right: -14px; }
  .shot-nav[disabled] { opacity: 0; pointer-events: none; }
  @media (hover: hover) and (pointer: fine) { .shot-nav { display: grid; } .shots { cursor: grab; } }

  .others { margin-top: 28px; }
  .others h2 { margin: 0 0 12px; font-size: 13px; font-weight: 700; color: var(--ink-soft); letter-spacing: .04em; }
  .others .row { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; }
  .others .row::-webkit-scrollbar { display: none; }
  .others a { flex: none; display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 8px; border: 1px solid var(--line); border-radius: 16px;
    background: var(--surface); color: var(--ink); text-decoration: none; font-weight: 600; font-size: 14px; }
  .others a img { width: 36px; height: 36px; border-radius: 9px; }
  .others a:hover { border-color: #3D473C; }

  main.wrap { padding-bottom: 56px; }

  footer { border-top: 1px solid var(--line); color: var(--ink-soft); font-size: 13px; }
  footer .wrap { padding-top: 20px; padding-bottom: 28px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; }
  footer .foot-left { display: grid; gap: 6px; }
  footer .foot-links { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 14px; }
  footer .social { display: flex; flex-wrap: wrap; gap: 8px; }
  footer .social a { display: inline-flex; align-items: center; gap: 5px; padding: 6px 12px 6px 9px; border: 1px solid var(--line);
    border-radius: 999px; color: var(--ink); text-decoration: none; font-weight: 600; background: var(--surface); }
  footer .social a:hover { border-color: var(--ink-soft); }
  /* 유튜브 아이콘은 공식 모양·색 그대로, 높이 24px(브랜드 규칙). */
  footer .social svg { flex: none; display: block; }

  /* ── 태블릿: 2열 ── */
  @media (max-width: 960px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

  /* ── 휴대폰: 한 줄 카드, 단추는 아래 두 칸 ── */
  @media (max-width: 640px) {
    .wrap { padding: 0 16px; }
    header .wrap { padding-top: 14px; padding-bottom: 10px; }
    .langs button { padding: 5px 9px; }
    .intro { padding: 6px 0 0; }
    .intro h1 { font-size: 24px; }
    .intro p { font-size: 14px; margin-top: 4px; }
    .chips { margin: 14px -16px 0; padding: 0 16px 2px; }
    .chip { font-size: 13.5px; padding: 6px 13px; }
    .group { margin-top: 18px; }
    .group h2 { margin-bottom: 8px; }
    .grid { grid-template-columns: minmax(0, 1fr); gap: 10px; }
    .card { padding: 14px; gap: 12px; border-radius: 20px; }
    .card h3 a::after { border-radius: 20px; }
    .card img.ic { width: 52px; height: 52px; border-radius: 12px; }
    .card h3 { font-size: 16px; }
    .card .sub { font-size: 13px; -webkit-line-clamp: 1; }
    .card .cat { display: none; }
    .store { min-height: 38px; font-size: 13.5px; }
    .pill { min-height: 28px; }
    .card.soon .dl { display: none; }
    .pill.mini { display: inline-flex; flex: none; font-size: 12px; padding: 4px 10px; min-height: 26px; }
    .card.soon .go { display: none; }
    .others .row { margin: 0 -16px; padding: 0 16px 4px; }

    .hero { grid-template-columns: minmax(0, 1fr); padding: 22px; gap: 14px; border-radius: 24px; }
    .hero img.icon { width: 80px; height: 80px; border-radius: 18px; }
    .hero h1 { font-size: 27px; }
    .tagline { font-size: 18px; }
    .stores .store { flex: 1 1 0; padding: 10px 12px; }
    .features { grid-template-columns: minmax(0, 1fr); }
    .shots img { width: 160px; }
  }
</style>
</head>

      ja: { sub: 'わたしのミニゲーム', tagline: 'ひまな時に1回、わたしのミニゲーム。', desc: 'アーケード・パズル・脳トレをポケットに。ちょっとした休憩に1回ずつ。', features: [] },

// 분류(칩은 앱에 실제로 있는 분류만, 이 순서로).
const CAT_ORDER = ['body', 'play', 'music'];
const CAT = { myslowbody: 'body', myslowsleep: 'body', myfidget: 'play', mypartygames: 'play', myminigame: 'play', myscore: 'music', myvocal: 'music' };
APPS.forEach(a => { a.cat = a.cat || CAT[a.id] || 'play'; a.page = a.page || `${a.id}/`; });
const isReleased = a => !!(a.appStore || a.playStore);

const textOf = a => a.text[lang] || a.text.en;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ── 언어 ── 한·영·일 셋(2026-10-02 사용자: 중국어는 뺀다, 문구는 남겨 둔다).
const LANGS = ['en', 'ko', 'ja'];
const SNS = {
  ko: { ig: 'mystudio_kr', yt: 'mystudioapps' },
  ja: { ig: 'mystudio_jp', yt: 'mystudio_japan' },
  en: { ig: 'mystudio_en', yt: 'mystudio_en' },
};
function pickLang() {
  const q = new URLSearchParams(location.search).get('lang');
  if (LANGS.includes(q)) return q;
  try { const s = localStorage.getItem('lang'); if (LANGS.includes(s)) return s; } catch (e) {}
  const prefs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en'];
  for (const l of prefs) { const n = String(l).slice(0, 2).toLowerCase(); if (LANGS.includes(n)) return n; }
  return 'en';
}
let lang = pickLang();
let filter = 'all';
try { const f = sessionStorage.getItem('cat'); if (f) filter = f; } catch (e) {}

// #앱 → 그 앱 소개, 해시 없음(또는 모르는 해시) → 모든 앱.
function currentAppId() {
  const h = location.hash.slice(1);
  return APPS.some(a => a.id === h) ? h : null;
}

const APPLE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.4 12.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.8-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9-1.7 0-3.3 1-4.2 2.6-1.8 3.1-.5 7.8 1.3 10.3.9 1.2 1.9 2.6 3.2 2.6 1.3-.1 1.8-.8 3.3-.8 1.6 0 2 .8 3.4.8 1.4 0 2.3-1.3 3.1-2.5 1-1.4 1.4-2.8 1.4-2.9 0 0-2.6-1-2.6-4.2zM13.9 4.9c.7-.9 1.2-2 1.1-3.2-1 0-2.3.7-3 1.6-.7.8-1.2 2-1.1 3.1 1.1.1 2.3-.6 3-1.5z"/></svg>';
const PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.6 1.8 13.8 12 3.6 22.2c-.4-.2-.6-.6-.6-1.1V2.9c0-.5.2-.9.6-1.1zm11.3 11.3 2.6 2.6-11.9 6.8 9.3-9.4zm3.8-3.8 2.8 1.6c.8.5.8 1.7 0 2.2l-2.8 1.6-2.9-2.8 2.9-2.6zM5.6 1.5l11.9 6.8-2.6 2.6-9.3-9.4z"/></svg>';

// 짧은 링크(?c=꼬리표)로 온 사람: 스토어 단추에 꼬리표를 붙이고(App Store pt·ct, Play referrer utm), GA4 app_link 는 들어올 때 한 번.
const CAMPAIGN = (/[?&]c=([A-Za-z0-9_\-]{1,40})/.exec(location.search) || [])[1] || '';
if (CAMPAIGN) {
  const g = document.createElement('script');
  g.async = true; g.src = 'https://www.googletagmanager.com/gtag/js?id=G-LXDJEBG8BD';
  document.head.appendChild(g);
  window.dataLayer = window.dataLayer || [];
  window.gtag = function () { window.dataLayer.push(arguments); };
  gtag('consent', 'default', { ad_storage: 'denied', ad_user_data: 'denied', ad_personalization: 'denied' });
  gtag('js', new Date());
  gtag('config', 'G-LXDJEBG8BD', { send_page_view: false, allow_google_signals: false });
  const ua = navigator.userAgent || '';
  const st = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) ? 'ios' : /Android/.test(ua) ? 'android' : 'web';
  gtag('event', 'app_link', { link: CAMPAIGN, store: st });
}
function tagged(url) {
  if (!CAMPAIGN || !url) return url;
  if (url.includes('apps.apple.com')) return url + (url.includes('?') ? '&' : '?') + 'pt=129467809&ct=' + CAMPAIGN + '&mt=8';
  if (url.includes('play.google.com')) return url + '&referrer=' + encodeURIComponent('utm_source=' + CAMPAIGN.split('_')[0] + '&utm_medium=social&utm_campaign=' + CAMPAIGN);
  return url;
}
// 꼬리표로 온 사람이 스토어 단추를 누르면 store_click(앱·스토어·꼬리표) — 10/11 사용자. 꼬리표 없는 방문은 GA 를 안 불러 기록 없음.
document.addEventListener('click', e => {
  const s = e.target.closest('a.store[data-app]');
  if (s && CAMPAIGN && window.gtag) gtag('event', 'store_click', { app: s.dataset.app, store: s.dataset.store, link: CAMPAIGN });
});

function storeButton(a, which, t) {
  const url = tagged(which === 'ios' ? a.appStore : a.playStore);
  const icon = which === 'ios' ? APPLE : PLAY;
  const label = which === 'ios' ? t.appStore : t.playStore;
  return url
    ? `<a class="store" href="${url}" target="_blank" rel="noopener" data-app="${a.id}" data-store="${which}">${icon}${esc(label)}</a>`
    : `<span class="store soon" title="${esc(label)}">${icon}${esc(t.comingSoon)}</span>`;
}

// ── 모든 앱(첫 화면) ──
function card(a, t) {
  const x = textOf(a);
  const dl = isReleased(a)
    ? `${storeButton(a, 'ios', t)}${storeButton(a, 'android', t)}`
    : `<span class="pill">${esc(t.comingSoon)}</span>`;
  return `
    <article class="card${isReleased(a) ? '' : ' soon'}" data-cat="${a.cat}">
      <div class="top">
        <img class="ic" src="${a.icon}" alt="" loading="lazy" width="60" height="60">
        <div class="txt">
          <h3><a href="#${a.id}">${esc(a.name)}</a></h3>
          <p class="sub">${esc(x.sub)}</p>
          <span class="cat">${esc(t.cats[a.cat] || '')}</span>
        </div>
        ${isReleased(a) ? '' : `<span class="pill mini">${esc(t.comingSoon)}</span>`}
        <span class="go" aria-hidden="true">›</span>
      </div>
      <div class="dl">${dl}</div>
    </article>`;
}

function renderHome() {
  const t = UI[lang];
  document.title = 'MyStudio';
  const cats = CAT_ORDER.filter(c => APPS.some(a => a.cat === c));
  if (filter !== 'all' && !cats.includes(filter)) filter = 'all';
  const shown = APPS.filter(a => filter === 'all' || a.cat === filter);
  const rel = shown.filter(isReleased), up = shown.filter(a => !isReleased(a));
  const group = (title, list) => list.length ? `
    <section class="group"><h2>${esc(title)}</h2><div class="grid">${list.map(a => card(a, t)).join('')}</div></section>` : '';
  document.getElementById('view').innerHTML = `
    <section class="intro">
      <h1>${t.heroTitle}</h1>
      <p>${esc(t.heroSub)}</p>
    </section>
    <div class="chips" role="group" aria-label="Category">
      ${['all', ...cats].map(c => `<button class="chip" data-cat="${c}" aria-pressed="${c === filter}">${esc(c === 'all' ? t.all : t.cats[c])}</button>`).join('')}
    </div>
    ${group(t.released, rel)}
    ${group(t.upcoming, up)}`;
  document.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
    filter = b.dataset.cat;
    try { sessionStorage.setItem('cat', filter); } catch (e) {}
    renderHome();
  }));
}

// ── 앱 소개(#앱) ──
function renderApp(a) {
  const t = UI[lang];
  const x = textOf(a);
  document.title = `${a.name}: MyStudio`;
  const others = APPS.filter(o => o.id !== a.id);
  document.getElementById('view').innerHTML = `
    <a class="back" href="#">‹ ${esc(t.back)}</a>
    <section class="hero">
      <img class="icon" src="${a.icon}" alt="${esc(a.name)}">
      <div>
        <h1>${esc(a.name)}</h1>
        <p class="tagline">${esc(x.tagline)}</p>
        <p class="desc">${esc(x.desc)}</p>
        <div class="stores">
          ${isReleased(a) ? storeButton(a, 'ios', t) + storeButton(a, 'android', t) : `<span class="pill">${esc(t.comingSoon)}</span>`}
        </div>
        ${!x.features.length ? `<a class="more-link" href="${a.page}">${esc(t.morePage)} ›</a>` : ''}
      </div>
    </section>
    ${x.features.length ? `<section class="features">
      ${x.features.map(([e, h, p]) => `
        <div class="feature"><div class="emoji">${e}</div><h3>${esc(h)}</h3><p>${esc(p)}</p></div>`).join('')}
    </section>` : ''}
    ${a.shots.length ? `<div class="shots-wrap">
      <button class="shot-nav prev" type="button" aria-label="Previous">‹</button>
      <section class="shots" aria-label="Screenshots">
        ${a.shots.map(s => `<img loading="lazy" draggable="false" src="assets/${a.id}/${lang}_${s}.jpg" alt="">`).join('')}
      </section>
      <button class="shot-nav next" type="button" aria-label="Next">›</button>
    </div>` : ''}
    <section class="others">
      <h2>${esc(t.others)}</h2>
      <div class="row">${others.map(o => `<a href="#${o.id}"><img src="${o.icon}" alt="">${esc(o.name)}</a>`).join('')}</div>
    </section>`;
  wireShots();
}

// ── 스크린샷 넘기기(지금 사이트와 같음) ──
function wireShots() {
  const box = document.querySelector('.shots');
  if (!box) return;
  const prev = document.querySelector('.shot-nav.prev');
  const next = document.querySelector('.shot-nav.next');
  const step = () => (box.querySelector('img')?.offsetWidth || 200) + 14;
  const update = () => {
    prev.disabled = box.scrollLeft <= 2;
    next.disabled = box.scrollLeft + box.clientWidth >= box.scrollWidth - 2;
  };
  prev.onclick = () => box.scrollBy({ left: -step() * 2, behavior: 'smooth' });
  next.onclick = () => box.scrollBy({ left: step() * 2, behavior: 'smooth' });
  box.addEventListener('scroll', update, { passive: true });
  box.querySelectorAll('img').forEach(i => i.addEventListener('load', update));
  update();
  let down = false, sx = 0, sl = 0;
  box.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'mouse') return;
    down = true; sx = e.clientX; sl = box.scrollLeft;
    box.setPointerCapture(e.pointerId); box.classList.add('dragging');
  });
  box.addEventListener('pointermove', e => { if (down) box.scrollLeft = sl - (e.clientX - sx); });
  const end = () => {
    if (!down) return;
    down = false; box.classList.remove('dragging');
    const w = step();
    box.scrollTo({ left: Math.round(box.scrollLeft / w) * w, behavior: 'smooth' });
  };
  box.addEventListener('pointerup', end);
  box.addEventListener('pointercancel', end);
}

// 바닥글 방침·약관: 앱 소개에선 그 앱 것, 첫 화면에선 첫 앱 것(지금과 같음).
function renderFooter() {
  const a = APPS.find(x => x.id === currentAppId()) || APPS[0];
  document.getElementById('foot-privacy').href = `${a.privacy}?lang=${lang}`;
  document.getElementById('foot-terms').href = `${a.terms}?lang=${lang}`;
  document.getElementById('foot-support').href = a.support;
}

let homeScroll = 0;
function renderView() {
  const id = currentAppId();
  if (id) renderApp(APPS.find(a => a.id === id)); else renderHome();
  renderFooter();
}

function render() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = UI[lang][el.dataset.i18n]; });
  const sns = SNS[lang] || SNS.en;
  const ig = document.getElementById('sns-ig'), yt = document.getElementById('sns-yt');
  ig.href = `https://www.instagram.com/${sns.ig}`; ig.setAttribute('aria-label', `Instagram @${sns.ig}`);
  document.getElementById('sns-ig-name').textContent = `@${sns.ig}`;
  yt.href = `https://www.youtube.com/@${sns.yt}`; yt.setAttribute('aria-label', `YouTube @${sns.yt}`);
  document.getElementById('sns-yt-name').textContent = `@${sns.yt}`;
  document.querySelectorAll('.langs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  renderView();
}

document.querySelectorAll('.langs button').forEach(b => b.addEventListener('click', () => {
  lang = b.dataset.lang;
  try { localStorage.setItem('lang', lang); } catch (e) {}
  render();
}));
// 앱 소개로 갈 때 첫 화면 스크롤 위치를 기억했다가 '모든 앱'으로 돌아오면 그 자리로.
let wasHome = !currentAppId();
window.addEventListener('hashchange', () => {
  const toHome = !currentAppId();
  if (wasHome && !toHome) homeScroll = window.scrollY;
  renderView();
  window.scrollTo({ top: toHome ? homeScroll : 0 });
  wasHome = toHome;
});
// '#' 만 남는 주소는 깨끗하게.
document.addEventListener('click', e => {
  const l = e.target.closest('a[href="#"]');
  if (!l) return;
  e.preventDefault();
  if (location.hash) location.hash = '';
  history.replaceState(null, '', location.pathname + location.search);
});
render();
</script>
