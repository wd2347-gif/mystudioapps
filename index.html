  :root {
    color-scheme: dark;
    --bg: #0E110D; --surface: #191D18; --ink: #F1F3EE; --ink-soft: #9BA49A;
    --line: #2C332B; --green: #43D873; --green-fill: #43D873; --wash: rgba(67, 216, 115, .12);

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Pretendard", -apple-system, "Apple SD Gothic Neo", "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.6;

  a { color: var(--green); }

  /* ── 머리글 ── */

    max-width: 1160px; margin: 0 auto; padding: 22px 24px;

  .brand { font-weight: 800; font-size: 20px; letter-spacing: -.01em; color: var(--ink); text-decoration: none; }
  .brand span { color: var(--green); }
  .controls { display: flex; align-items: center; gap: 8px; }
  .langs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
  .langs button {
    border: 0; background: transparent; color: var(--ink-soft); font: inherit; font-size: 13px; font-weight: 600;
    padding: 6px 12px; border-radius: 999px; cursor: pointer;
  }
  .langs button[aria-pressed="true"] { background: var(--wash); color: var(--green); }

  /* ── 본문: 왼쪽 앱 소개 · 오른쪽 앱 아이콘 ── */
  .layout {
    max-width: 1160px; margin: 0 auto; padding: 8px 24px 64px;
    display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 32px; align-items: start;
  }
  aside {
    position: sticky; top: 24px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 18px; box-shadow: var(--shadow);
  }
  aside h2 { margin: 2px 6px 12px; font-size: 13px; font-weight: 700; color: var(--ink-soft); letter-spacing: .04em; text-transform: uppercase; }
  .apps { display: flex; flex-direction: column; gap: 6px; }
  .app-btn {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    border: 1px solid transparent; background: transparent; color: inherit; font: inherit;
    padding: 10px; border-radius: 18px; cursor: pointer;
  }
  .app-btn:hover { background: var(--wash); }
  .app-btn[aria-current="true"] { background: var(--wash); border-color: var(--green-fill); }
  .app-btn img, .app-btn .soon-icon { width: 52px; height: 52px; border-radius: 13px; flex: none; }
  .soon-icon { border: 2px dashed var(--line); display: grid; place-items: center; color: var(--ink-soft); font-size: 22px; }
  .app-btn strong { display: block; font-size: 15px; }
  .app-btn small { display: block; color: var(--ink-soft); font-size: 12px; line-height: 1.4; }
  .app-btn[disabled] { cursor: default; opacity: .75; }
  .app-btn[disabled]:hover { background: transparent; }

  /* ── 앱 소개 ── */
  .hero {
    background: var(--surface); border: 1px solid var(--line); border-radius: 28px; padding: 36px; box-shadow: var(--shadow);
    display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 28px; align-items: center;
  }
  .hero img.icon { width: 120px; height: 120px; border-radius: 27px; box-shadow: 0 8px 24px rgba(28, 154, 70, .25); }
  .hero .soon-icon.icon { width: 120px; height: 120px; border-radius: 27px; font-size: 52px; }
  .hero h1 { margin: 0; font-size: 34px; line-height: 1.2; letter-spacing: -.02em; }
  .tagline { margin: 6px 0 10px; font-size: 20px; font-weight: 700; color: var(--green); }
  .desc { margin: 0 0 18px; color: var(--ink-soft); }
  .stores { display: flex; flex-wrap: wrap; gap: 10px; }
  .store {
    display: inline-flex; align-items: center; gap: 8px; padding: 11px 18px; border-radius: 14px;
    background: var(--ink); color: var(--bg); text-decoration: none; font-weight: 700; font-size: 14px;
  }
  .store.soon { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); cursor: default; }
  .store svg { width: 18px; height: 18px; fill: currentColor; }

  .features { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin: 18px 0; }
  .feature { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 22px; }
  .feature .emoji { font-size: 24px; }
  .feature h3 { margin: 8px 0 4px; font-size: 17px; }
  .feature p { margin: 0; color: var(--ink-soft); font-size: 14px; }

  .shots-wrap { position: relative; }
  .shots { display: flex; gap: 14px; overflow-x: auto; padding: 4px 2px 12px; scroll-snap-type: x mandatory; scroll-behavior: smooth; scrollbar-width: none; }
  .shots::-webkit-scrollbar { display: none; }
  .shots.dragging { scroll-snap-type: none; scroll-behavior: auto; cursor: grabbing; }
  .shots img { user-select: none; -webkit-user-drag: none; }
  .shot-nav {
    position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer;
    display: none; place-items: center; box-shadow: var(--shadow); font-size: 22px; line-height: 1;
  }
  .shot-nav.prev { left: -14px; } .shot-nav.next { right: -14px; }
  .shot-nav[disabled] { opacity: 0; pointer-events: none; }
  @media (hover: hover) and (pointer: fine) {
    .shot-nav { display: grid; }
    .shots { cursor: grab; }
  }
  .shots img {
    width: 200px; height: auto; border-radius: 22px; border: 1px solid var(--line); flex: none;
    scroll-snap-align: start; background: var(--surface);
  }

  footer { max-width: 1160px; margin: 0 auto; padding: 20px 24px 28px; color: var(--ink-soft); font-size: 13px; border-top: 1px solid var(--line);
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; }
  footer .social { display: flex; flex-wrap: wrap; gap: 8px; }
  footer .foot-left { display: grid; gap: 6px; }
  footer .foot-links { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 14px; }
  footer .social a { display: inline-flex; align-items: center; gap: 5px; padding: 6px 12px 6px 9px; border: 1px solid var(--line);
    border-radius: 999px; color: var(--ink); text-decoration: none; font-weight: 600; background: var(--surface); }
  footer .social a:hover { border-color: var(--ink-soft); }
  /* 유튜브 아이콘은 공식 모양·색 그대로, 높이 24px(브랜드 규칙 최소 20 — 2026-10-07 YouTube API 감사 III.F.2a).
     크기를 줄이거나 색·투명도·필터를 걸지 않는다. */
  footer .social svg { flex: none; display: block; }

  /* ── 휴대폰: 아이콘 줄을 위로, 가로로 ── */
  @media (max-width: 820px) {
    .layout { grid-template-columns: minmax(0, 1fr); gap: 16px; padding: 4px 16px 48px; }
    header { padding: 16px; }
    .langs button { padding: 6px 9px; }
    aside { position: static; order: -1; padding: 12px; border-radius: 20px; }
    aside h2 { display: none; }
    .apps { flex-direction: row; overflow-x: auto; }
    .app-btn { width: auto; flex: none; padding: 8px 12px 8px 8px; }
    .app-btn small { display: none; }
    .app-btn img, .app-btn .soon-icon { width: 40px; height: 40px; border-radius: 10px; }
    .hero { grid-template-columns: minmax(0, 1fr); padding: 24px; text-align: left; gap: 16px; }
    .hero img.icon { width: 88px; height: 88px; border-radius: 20px; }
    .hero .soon-icon.icon { width: 88px; height: 88px; border-radius: 20px; font-size: 40px; }
    .hero h1 { font-size: 28px; }
    .features { grid-template-columns: minmax(0, 1fr); }
    .shots img { width: 160px; }
  }
</style>
</head>

// 고르지 않은 언어의 문구가 없는 앱(MyScore 는 한·영·일)은 영어로.
const textOf = a => a.text[lang] || a.text.en;
function iconOf(a, cls = '') {
  return a.icon
    ? `<img${cls ? ` class="${cls}"` : ''} src="${a.icon}" alt="${esc(a.name)}">`
    : `<span class="soon-icon${cls ? ` ${cls}` : ''}" aria-hidden="true">${esc(a.iconText || '+')}</span>`;
}

// ── 언어 ── 한·영·일 셋(2026-10-02 사용자: 중국어는 뺀다 — 문구는 남아 있어도 고르지 않는다).
const LANGS = ['en', 'ko', 'ja'];
// 언어마다 그 나라 계정(2026-10-02 사용자) — 인스타그램 · 유튜브.
const SNS = {
  ko: { ig: 'mystudio_kr', yt: 'mystudioapps' },
  ja: { ig: 'mystudio_jp', yt: 'mystudio_japan' },
  en: { ig: 'mystudio_en', yt: 'mystudio_en' },
};
function pickLang() {
  const q = new URLSearchParams(location.search).get('lang');
  if (LANGS.includes(q)) return q;
  try { const s = localStorage.getItem('lang'); if (LANGS.includes(s)) return s; } catch (e) {}
  // 기기 언어 목록에서 처음 맞는 것(ko-KR → ko). 셋 다 아니면 영어.
  const prefs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en'];
  for (const l of prefs) { const n = String(l).slice(0, 2).toLowerCase(); if (LANGS.includes(n)) return n; }
  return 'en';
}
let lang = pickLang();

function currentAppId() {
  const h = location.hash.slice(1);
  return APPS.some(a => a.id === h) ? h : APPS[0].id;
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const APPLE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.4 12.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.8-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9-1.7 0-3.3 1-4.2 2.6-1.8 3.1-.5 7.8 1.3 10.3.9 1.2 1.9 2.6 3.2 2.6 1.3-.1 1.8-.8 3.3-.8 1.6 0 2 .8 3.4.8 1.4 0 2.3-1.3 3.1-2.5 1-1.4 1.4-2.8 1.4-2.9 0 0-2.6-1-2.6-4.2zM13.9 4.9c.7-.9 1.2-2 1.1-3.2-1 0-2.3.7-3 1.6-.7.8-1.2 2-1.1 3.1 1.1.1 2.3-.6 3-1.5z"/></svg>';
const PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.6 1.8 13.8 12 3.6 22.2c-.4-.2-.6-.6-.6-1.1V2.9c0-.5.2-.9.6-1.1zm11.3 11.3 2.6 2.6-11.9 6.8 9.3-9.4zm3.8-3.8 2.8 1.6c.8.5.8 1.7 0 2.2l-2.8 1.6-2.9-2.8 2.9-2.6zM5.6 1.5l11.9 6.8-2.6 2.6-9.3-9.4z"/></svg>';

function renderList() {
  const t = UI[lang];
  const cur = currentAppId();
  const items = APPS.map(a => `
    <button class="app-btn" data-app="${a.id}" aria-current="${a.id === cur}">
      ${iconOf(a)}
      <span><strong>${esc(a.name)}</strong><small>${esc(textOf(a).sub)}</small></span>
    </button>`).join('');
  // '다음 앱 +' 칸은 늘 맨 끝에 (2026-10-06 사용자: 세 번째 자리에 그대로).
  const soon = `
    <button class="app-btn" disabled>
      <span class="soon-icon">+</span>
      <span><strong>${esc(t.soonApp)}</strong><small>${esc(t.soonAppSub)}</small></span>
    </button>`;
  document.getElementById('app-list').innerHTML = items + soon;
  document.querySelectorAll('.app-btn[data-app]').forEach(b =>
    b.addEventListener('click', () => { location.hash = b.dataset.app; }));
}

function storeButton(url, icon, label, t) {
  return url
    ? `<a class="store" href="${url}" target="_blank" rel="noopener">${icon}${esc(label)}</a>`
    : `<span class="store soon">${icon}${esc(label)} · ${esc(t.comingSoon)}</span>`;
}

function renderApp() {
  const t = UI[lang];
  const a = APPS.find(x => x.id === currentAppId());
  const x = textOf(a);
  document.title = `${a.name} — MyStudio`;
  document.getElementById('app-panel').innerHTML = `
    <section class="hero">
      ${iconOf(a, 'icon')}
      <div>
        <h1>${esc(a.name)}</h1>
        <p class="tagline">${esc(x.tagline)}</p>
        <p class="desc">${esc(x.desc)}</p>
        <div class="stores">
          ${storeButton(a.appStore, APPLE, t.appStore, t)}
          ${storeButton(a.playStore, PLAY, t.playStore, t)}
        </div>
      </div>
    </section>
    <section class="features">
      ${x.features.map(([e, h, p]) => `
        <div class="feature"><div class="emoji">${e}</div><h3>${esc(h)}</h3><p>${esc(p)}</p></div>`).join('')}
    </section>
    ${a.shots.length ? `<div class="shots-wrap">
      <button class="shot-nav prev" type="button" aria-label="Previous">‹</button>
      <section class="shots" aria-label="Screenshots">
        ${a.shots.map(s => `<img loading="lazy" draggable="false" src="assets/${a.id}/${lang}_${s}.jpg" alt="">`).join('')}
      </section>
      <button class="shot-nav next" type="button" aria-label="Next">›</button>
    </div>` : ''}
`;
}

// ── 스크린샷 넘기기 — PC 는 화살표와 마우스 끌기, 휴대폰은 손가락으로. ──
function wireShots() {
  const box = document.querySelector('.shots');
  if (!box) return;
  const prev = document.querySelector('.shot-nav.prev');
  const next = document.querySelector('.shot-nav.next');
  const step = () => (box.querySelector('img')?.offsetWidth || 200) + 14;
  const update = () => {
    prev.disabled = box.scrollLeft <= 2;
    next.disabled = box.scrollLeft + box.clientWidth >= box.scrollWidth - 2;
  };
  prev.onclick = () => box.scrollBy({ left: -step() * 2, behavior: 'smooth' });
  next.onclick = () => box.scrollBy({ left: step() * 2, behavior: 'smooth' });
  box.addEventListener('scroll', update, { passive: true });
  box.querySelectorAll('img').forEach(i => i.addEventListener('load', update));
  window.addEventListener('resize', update);
  update();
  // 마우스로 끌어서 넘기기(터치는 브라우저 기본 스크롤이 한다).
  let down = false, sx = 0, sl = 0, moved = false;
  box.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'mouse') return;
    down = true; moved = false; sx = e.clientX; sl = box.scrollLeft;
    box.setPointerCapture(e.pointerId); box.classList.add('dragging');
  });
  box.addEventListener('pointermove', e => {
    if (!down) return;
    const dx = e.clientX - sx;
    if (Math.abs(dx) > 3) moved = true;
    box.scrollLeft = sl - dx;
  });
  const end = () => {
    if (!down) return;
    down = false; box.classList.remove('dragging');
    // 끈 방향으로 가장 가까운 장에 맞춘다.
    const w = step();
    box.scrollTo({ left: Math.round(box.scrollLeft / w) * w, behavior: 'smooth' });
  };
  box.addEventListener('pointerup', end);
  box.addEventListener('pointercancel', end);
}

// 바닥글의 방침·약관·문의 — 앱 칸 아래에 있던 것을 내렸다(2026-09-30 사용자). 지금 보는 앱의 것을
// 지금 언어로 연다 (앱이 둘이 되며 2026-10-06: 전에는 늘 첫 앱의 것이었다).
function renderFooter() {
  const a = APPS.find(x => x.id === currentAppId());
  document.getElementById('foot-privacy').href = `${a.privacy}?lang=${lang}`;
  document.getElementById('foot-terms').href = `${a.terms}?lang=${lang}`;
  document.getElementById('foot-support').href = a.support;
}

function render() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = UI[lang][el.dataset.i18n]; });
  renderFooter();
  const sns = SNS[lang] || SNS.en;
  const ig = document.getElementById('sns-ig'), yt = document.getElementById('sns-yt');
  ig.href = `https://www.instagram.com/${sns.ig}`; ig.setAttribute('aria-label', `Instagram @${sns.ig}`);
  document.getElementById('sns-ig-name').textContent = `@${sns.ig}`;
  yt.href = `https://www.youtube.com/@${sns.yt}`; yt.setAttribute('aria-label', `YouTube @${sns.yt}`);
  document.getElementById('sns-yt-name').textContent = `@${sns.yt}`;
  document.querySelectorAll('.langs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  renderList();
  renderApp();
  wireShots();
}

document.querySelectorAll('.langs button').forEach(b => b.addEventListener('click', () => {
  lang = b.dataset.lang;
  try { localStorage.setItem('lang', lang); } catch (e) {}
  render();
}));
window.addEventListener('hashchange', () => { renderList(); renderApp(); renderFooter(); wireShots(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
render();
</script>
