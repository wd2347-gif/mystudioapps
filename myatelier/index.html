    terms: 'شروط الاستخدام', privacy: 'سياسة الخصوصية', support: 'الدعم',
  },
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function norm(l) {
  l = String(l).toLowerCase();
  if (l.startsWith('zh')) return /hant|tw|hk|mo/.test(l) ? 'zh-Hant' : null;
  const n = l.slice(0, 2); return LANGS.includes(n) ? n : null;
}
function pick() {
  const q = new URLSearchParams(location.search).get('lang');
  if (LANGS.includes(q)) return q;
  try { const s = localStorage.getItem('lang'); if (LANGS.includes(s)) return s; } catch (e) {}
  for (const l of (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en'])) {
    const n = norm(l); if (n) return n;
  }
  return 'en';
}
function show(lang) {
  const t = T[lang];
  document.documentElement.lang = HTML_LANG[lang] || lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.title = t.name + ': MyStudio';
  for (const k of ['name', 'sub', 'tagline', 'desc', 'soon', 'devices']) document.getElementById(k).textContent = t[k];
  document.querySelector('.icon').alt = t.name;
  document.getElementById('shots').innerHTML = SHOTS.map((s, i) =>
    `<figure><img src="../assets/myatelier/${s}.jpg" alt="${esc(t.shots[i])}" width="460" height="937" loading="lazy"><figcaption>${esc(t.shots[i])}</figcaption></figure>`).join('');
  document.getElementById('features').innerHTML = t.features.map(([e, h, p]) =>
    `<div class="feature"><div class="emoji">${e}</div><h3>${esc(h)}</h3><p>${esc(p)}</p></div>`).join('');
  const terms = document.getElementById('f-terms'), privacy = document.getElementById('f-privacy');
  terms.textContent = t.terms; terms.href = `terms.html?lang=${lang}`;
  privacy.textContent = t.privacy; privacy.href = `privacy.html?lang=${lang}`;
  document.getElementById('f-support').textContent = t.support;
  document.getElementById('lang').value = lang;
}
document.getElementById('lang').addEventListener('change', e => {
  try { localStorage.setItem('lang', e.target.value); } catch (err) {}
  try { const u = new URL(location.href); u.searchParams.set('lang', e.target.value); history.replaceState(null, '', u); } catch (err) {}
  show(e.target.value);
});
show(pick());
</script>
