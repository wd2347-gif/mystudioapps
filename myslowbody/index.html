<script>
  (function () {
    var ua = navigator.userAgent || '';
    var ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var android = /Android/.test(ua);
    var m = /[?&]c=([A-Za-z0-9_\-]{1,40})/.exec(location.search);
    var c = m ? m[1] : '';
    var appStore = 'https://apps.apple.com/app/id6812821519' + (c ? '?pt=129467809&ct=' + c + '&mt=8' : '');
    var playStore = ''; // Play 공개 뒤: 'https://play.google.com/store/apps/details?id=com.ymc.myslowbody'

      playStore += '&referrer=' + encodeURIComponent('utm_source=' + c.split('_')[0] + '&utm_medium=social&utm_campaign=' + c);
    }
    var dest = ios ? appStore
      : android && playStore ? playStore
      : '../' + location.search + '#myslowbody';
    var gone = false;
    function go() { if (!gone) { gone = true; location.replace(dest); } }
    window.dataLayer = window.dataLayer || [];
    function gtag() { window.dataLayer.push(arguments); }
    gtag('consent', 'default', { ad_storage: 'denied', ad_user_data: 'denied', ad_personalization: 'denied' });

    gtag('config', 'G-CK4SB37EH2', { send_page_view: false, allow_google_signals: false });
    gtag('event', 'app_link', {
      link: c || 'none',
      store: ios ? 'ios' : android ? 'android' : 'web',
      event_callback: go,
      event_timeout: 800
    });
    setTimeout(go, 900);
  })();
