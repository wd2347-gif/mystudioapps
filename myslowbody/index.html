<!-- 한 링크(2026-09-30, 인스타 프로필 링크 등): 아이폰·아이패드는 App Store 로 바로, 안드로이드는 Play 가
     공개되면 Play 로(그 전엔 홈페이지), 그 밖(컴퓨터)은 홈페이지의 앱 소개로.
     ?c=ig_kr 처럼 캠페인 이름을 붙이면(2026-10-03, 광고·프로필 링크별 설치 세기) App Store 엔 캠페인 링크
     (pt 공급자 ID·ct — App Store Connect 분석 › 캠페인), Play 엔 referrer(utm_campaign — Play Console 획득 보고서)로 넘긴다. -->
<noscript><meta http-equiv="refresh" content="0; url=../#myslowbody"></noscript>
<script>
  (function () {
    var ua = navigator.userAgent || '';
    var ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var android = /Android/.test(ua);
    var m = /[?&]c=([A-Za-z0-9_\-]{1,40})/.exec(location.search);
    var c = m ? m[1] : '';
    var appStore = 'https://apps.apple.com/app/id6812821519' + (c ? '?pt=129467809&ct=' + c + '&mt=8' : '');
    var playStore = ''; // Play 공개 뒤: 'https://play.google.com/store/apps/details?id=com.ymc.myslowbody'
    if (playStore && c) {
      playStore += '&referrer=' + encodeURIComponent('utm_source=' + c.split('_')[0] + '&utm_medium=social&utm_campaign=' + c);
    }
    location.replace(ios ? appStore
      : android && playStore ? playStore
      : '../' + location.search + '#myslowbody');
  })();
</script>
