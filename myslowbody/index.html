     (pt 공급자 ID·ct — App Store Connect 분석 › 캠페인), Play 엔 referrer(utm_campaign — Play Console 획득 보고서)로 넘긴다. -->

<!-- 접속 집계(2026-10-03 사용자: 소셜별 접속 수) — Firebase 프로젝트 'MyStudio Links' 웹 앱의 GA4(G-LXDJEBG8BD, 2026-10-09 옮김).

     광고용 저장소·개인 맞춤 광고 신호는 끈다. -->
<meta name="color-scheme" content="light dark">
<!-- 이동 중 화면(2026-10-07 사용자: 넘어가는 동안 'MySlowBody' 파란 링크 한 줄만 보이던 것이 별로) —

     같아 넘어갈 때 튀지 않는다. 라이트·다크, 앱 초록. -->
<style>
  :root {
    --bg: #F3F6F2; --surface: #FFFFFF; --ink: #13201A; --ink-soft: #5A6A60; --line: #D8E1D7;
    --green: #1E8E4E; --on-green: #FFFFFF;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E110D; --surface: #191D18; --ink: #F1F3EE; --ink-soft: #9BA49A; --line: #2C332B;
      --green: #43D873; --on-green: #06120A;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Hiragino Sans", "Noto Sans JP", "Noto Sans KR", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .wrap {
    min-height: 100vh; min-height: 100svh;
    display: flex; flex-direction: column; align-items: center;
    padding: 26vh 24px 40px; padding-top: 26svh; text-align: center;
  }
  .icon { width: 88px; height: 88px; border-radius: 22px; display: block; box-shadow: 0 6px 20px rgba(0, 0, 0, .12); }
  h1 { margin: 18px 0 4px; font-size: 24px; font-weight: 800; letter-spacing: -.01em; }
  .tag { margin: 0; color: var(--ink-soft); font-size: 15px; }
  .status {
    margin: 26px 0 0; display: inline-flex; align-items: center; gap: 8px;
    color: var(--ink-soft); font-size: 14px; min-height: 20px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
  .btns { margin-top: 22px; width: 100%; max-width: 300px; display: flex; flex-direction: column; gap: 10px; }
  .btn {
    display: block; padding: 13px 16px; border-radius: 14px; text-decoration: none;
    font-size: 15px; font-weight: 700; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line);
  }
  .btn.primary { background: var(--green); border-color: var(--green); color: var(--on-green); }
  .btn:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
</style>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-LXDJEBG8BD"></script>
<script>
  (function () {
    var ua = navigator.userAgent || '';
    var ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var android = /Android/.test(ua);
    var m = /[?&]c=([A-Za-z0-9_\-]{1,40})/.exec(location.search);
    var c = m ? m[1] : '';
    var appStore = 'https://apps.apple.com/app/id6812821519' + (c ? '?pt=129467809&ct=' + c + '&mt=8' : '');
    var playStore = 'https://play.google.com/store/apps/details?id=com.ymc.myslowbody'; // Play 공개 2026-10-05(1.0.1)
    if (playStore && c) {
      playStore += '&referrer=' + encodeURIComponent('utm_source=' + c.split('_')[0] + '&utm_medium=social&utm_campaign=' + c);
    }
    var dest = ios ? appStore
      : android && playStore ? playStore
      : '../' + location.search + '#myslowbody';
    // 이동 중 화면이 쓸 값(본문 끝 스크립트가 글·버튼을 채운다).
    window.__ml = { ios: ios, android: android, appStore: appStore, playStore: playStore };
    var gone = false;
    function go() { if (!gone) { gone = true; location.replace(dest); } }
    window.dataLayer = window.dataLayer || [];
    function gtag() { window.dataLayer.push(arguments); }
    gtag('consent', 'default', { ad_storage: 'denied', ad_user_data: 'denied', ad_personalization: 'denied' });
    gtag('js', new Date());
    gtag('config', 'G-LXDJEBG8BD', { send_page_view: false, allow_google_signals: false });
    gtag('event', 'app_link', {
      link: c || 'none',
      store: ios ? 'ios' : android ? 'android' : 'web',
      event_callback: go,
      event_timeout: 800
    });
    setTimeout(go, 900);
  })();
</script>
</head>
<body>
<main class="wrap">
  <img class="icon" src="/assets/myslowbody/icon.png" alt="" width="88" height="88">
  <h1>MySlowBody</h1>
  <p class="tag" id="tag">스트레칭 · 느린 호흡 · 숙면</p>
  <p class="status"><span class="dot" aria-hidden="true"></span><span id="status">이동 중…</span></p>
  <div class="btns" id="btns">
    <a class="btn" id="btn-ios" href="https://apps.apple.com/app/id6812821519">App Store</a>
    <a class="btn" id="btn-play" href="https://play.google.com/store/apps/details?id=com.ymc.myslowbody">Google Play</a>
  </div>
</main>
<script>
  // 글은 기기 언어로(한·일·영, 그 밖은 영어), 버튼은 꼬리표(?c=)가 붙은 주소로, 기기에 맞는 쪽을 먼저.
  (function () {
    var m = window.__ml || {};
    var lang = (navigator.language || 'en').toLowerCase();
    var L = lang.indexOf('ko') === 0 ? 'ko' : lang.indexOf('ja') === 0 ? 'ja' : 'en';
    var T = {
      ko: { tag: '스트레칭 · 느린 호흡 · 숙면', ios: 'App Store로 이동 중…', android: 'Google Play로 이동 중…', web: '앱 소개로 이동 중…' },

      en: { tag: 'Stretch · Slow breathing · Deep sleep', ios: 'Opening the App Store…', android: 'Opening Google Play…', web: 'Opening the app page…' }
    }[L];
    document.documentElement.lang = L;
    document.getElementById('tag').textContent = T.tag;
    document.getElementById('status').textContent = m.ios ? T.ios : m.android ? T.android : T.web;
    var a = document.getElementById('btn-ios'), g = document.getElementById('btn-play');
    if (m.appStore) a.href = m.appStore;
    if (m.playStore) g.href = m.playStore;
    if (m.android) { a.parentNode.insertBefore(g, a); g.className = 'btn primary'; }
    else { a.className = 'btn primary'; }
  })();
</script>
