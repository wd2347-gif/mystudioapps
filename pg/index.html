<!-- 짧은 공유 주소(2026-10-16 My_PocketGames 부탁: 앱 최고 기록 공유 글의 링크가 대화방에서 세 줄을 차지) —
     mystudioapps.com/pg?c=share_<게임id> → /go/mypocketgames/?c=share_<게임id>(꼬리표 그대로 넘김, 접속 집계 · 스토어 이동은 그 페이지가 한다). -->
<!-- 2026-10-21 My_PocketGames 부탁: 카카오톡 · 인스타 같은 앱 안 브라우저는 유니버설 링크 · 앱 링크를 무시한다 →
     그때만 앱 전용 주소(mypocketgames://open/pg?c=…, 1.1.3 (22)부터)로 먼저 열어 보고, 2.5초 뒤에도 이 페이지가 보이면 지금처럼 /go 로(스토어, 10/21 밤 1.6 → 2.5초).
     Safari · 크롬 같은 일반 브라우저는 그대로 바로 /go(앱 전용 주소를 부르면 앱이 없을 때 '주소가 유효하지 않음' 오류). -->
<!-- 2026-10-21 밤 My_PocketGames 부탁(실기기): 아이폰 카톡은 앱 전용 주소 앞에 확인 창을 띄울 수 있고, 창이 떠 있는 동안 타이머가 지나면 스토어로 가 버린다 →
     카톡(아이폰 · 안드로이드)은 kakaotalk://web/openExternal 로 바깥 브라우저에 /pg/ 를 넘긴다(앱이 있으면 유니버설 링크 · 앱 링크로 바로 앱, 없으면 바깥 브라우저가 /go).
     카톡 안에서는 타이머 없음(돌아오면 단추만). 다른 앱 안 브라우저는 타이머 2.5초, 한 번이라도 가려지면(blur · hidden) 스토어로 보내지 않고 단추만. -->
<noscript><meta http-equiv="refresh" content="0; url=/go/mypocketgames/"></noscript>
<meta name="color-scheme" content="light dark">
<style>
  :root { --bg: #F3F6F2; --ink: #13201A; --line: #D8E1D7; --surface: #FFFFFF; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0E110D; --ink: #F1F3EE; --line: #2C332B; --surface: #191D18; } }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Hiragino Sans", sans-serif; }
  .wrap { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; align-items: center; padding: 26vh 24px 40px; padding-top: 26svh; }
  .icon { width: 88px; height: 88px; border-radius: 22px; display: block; box-shadow: 0 6px 20px rgba(0, 0, 0, .12); }
  .btn { margin-top: 22px; display: block; padding: 13px 22px; border-radius: 14px; text-decoration: none; font-weight: 700; color: var(--ink); background: var(--surface); border: 1px solid var(--line); }
  .open { margin-top: 26px; min-width: 220px; text-align: center; padding: 15px 26px; border-radius: 16px; font-size: 17px; font-weight: 800; text-decoration: none; color: #FFFFFF; background: #2F8F5B; }
  .install { margin-top: 16px; font-size: 14px; color: var(--ink); opacity: .7; }
</style>
<script>
(function () {
  var q = location.search;
  var go = '/go/mypocketgames/' + q;
  var ua = navigator.userAgent || '';
  var inApp = /KAKAOTALK|Instagram|FBAN|FBAV|FB_IAB|FBIOS|Line\/|NAVER\(inapp|DaumApps|everytimeApp|Barcelona|musical_ly|BytedanceWebview|Snapchat/i.test(ua);
  if (!inApp) { location.replace(go); return; }
  window.__pgGo = go;
  if (/KAKAOTALK/i.test(ua)) {
    var ext = 'kakaotalk://web/openExternal?url=' + encodeURIComponent('https://mystudioapps.com/pg/' + q);
    window.__pgApp = ext;
    try { location.href = ext; } catch (e) {}
    return;
  }
  var m = /[?&]c=([A-Za-z0-9_\-]{1,64})/.exec(q);
  var c = m ? m[1] : '';
  var path = 'open/pg' + (c ? '?c=' + c : '');
  var android = /Android/i.test(ua);
  var appUrl = android
    ? 'intent://' + path + '#Intent;scheme=mypocketgames;package=com.ymc.myminigame;S.browser_fallback_url=' + encodeURIComponent('https://mystudioapps.com' + go) + ';end'
    : 'mypocketgames://' + path;
  window.__pgApp = appUrl;
  var timer = setTimeout(function () { if (!document.hidden) location.replace(go); }, 2500);
  function stop() { clearTimeout(timer); }
  document.addEventListener('visibilitychange', function () { if (document.hidden) stop(); });
  window.addEventListener('pagehide', stop);
  window.addEventListener('blur', stop);
  try { location.href = appUrl; } catch (e) {}
})();
</script>
</head>
<body><main class="wrap"><img class="icon" src="/assets/myminigame/icon.png" alt="MyPocketGames" width="88" height="88"><noscript><a class="btn" href="/go/mypocketgames/">MyPocketGames</a></noscript>
<a class="open" id="open" href="#" hidden>앱에서 열기</a><a class="install" id="install" href="/go/mypocketgames/" hidden>앱 설치하기</a></main>
<script>
(function () {
  if (!window.__pgApp) return;
  var T = {
    ko: ['앱에서 열기', '앱 설치하기'], en: ['Open in app', 'Install the app'], ja: ['アプリで開く', 'アプリをインストール'],
    zh: ['在 App 中開啟', '安裝 App'], es: ['Abrir en la app', 'Instalar la app'], fr: ['Ouvrir dans l\u2019app', 'Installer l\u2019app'],
    de: ['In der App öffnen', 'App installieren'], pt: ['Abrir no app', 'Instalar o app'], ar: ['افتح في التطبيق', 'ثبّت التطبيق']
  };
  var l = (navigator.language || 'en').toLowerCase().slice(0, 2);
  var t = T[l] || T.en;
  var o = document.getElementById('open'), i = document.getElementById('install');
  o.textContent = t[0]; o.href = window.__pgApp; o.hidden = false;
  i.textContent = t[1]; i.href = window.__pgGo; i.hidden = false;
  if (l === 'ar') { o.dir = 'rtl'; i.dir = 'rtl'; }
})();
</script></body>
</html>
