function pt(e) { var r = rect || cv.getBoundingClientRect(); return { id: e.pointerId, x: e.clientX - r.left, y: e.clientY - r.top, t: now() }; }
function call(fn, p) { if (cur && cur[fn]) { try { cur[fn](p); } catch (x) { err(x); } } }
cv.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  rect = cv.getBoundingClientRect();
  unlockAudio();
  try { cv.setPointerCapture(e.pointerId); } catch (x) {}
  touched = true; lastTouch = now();
  call('down', pt(e));
});
cv.addEventListener('pointermove', function (e) { if (e.buttons || e.pointerType === 'touch') lastTouch = now(); call('move', pt(e)); });
cv.addEventListener('pointerup', function (e) { unlockAudio(); lastTouch = now(); call('up', pt(e)); });
cv.addEventListener('pointercancel', function (e) { call('up', pt(e)); });
cv.addEventListener('lostpointercapture', function (e) { call('up', pt(e)); });

var lastSwitch = -1e9;
$('next').addEventListener('click', function () {
  unlockAudio(); haptic(true);
  var t = now();
  if (t - lastSwitch < 280) return;
  lastSwitch = t;
  if (pos >= ORDER.length - 1) { install(); return; }
  Sfx.ui();
  startGame(pos + 1, true);
  post('switch:' + (pos + 1));
});
$('get').addEventListener('click', function () { unlockAudio(); haptic(true); install(); });

/* Touch hint: pulse at {x,y}, or a finger sliding from {x,y} by {dx,dy} */
function hintDot(x, y, a, k) {
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(70,15,30,' + (0.3 * a).toFixed(3) + ')';
  ctx.beginPath(); ctx.arc(x, y, 14, 0, TAU); ctx.stroke();
  ctx.fillStyle = 'rgba(' + accRGB[0] + ',' + accRGB[1] + ',' + accRGB[2] + ',' + ((0.5 + 0.15 * Math.sin(k * TAU)) * a).toFixed(3) + ')';
  ctx.beginPath(); ctx.arc(x, y, 12, 0, TAU); ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,' + (0.9 * a).toFixed(3) + ')'; ctx.stroke();
}
function drawHint(h) {
  var t = now() / 1000;
  if (h.dx || h.dy) {
    var P = 1.9, u = t % P, k = clamp(u / 1.25, 0, 1), e = easeInOut(k), a = u < 1.25 ? Math.min(1, u / 0.2) : Math.max(0, 1 - (u - 1.25) / 0.5);
    var x = h.x + h.dx * e, y = h.y + h.dy * e;
    ctx.lineCap = 'round';
    ctx.lineWidth = 12; ctx.strokeStyle = 'rgba(70,15,30,' + (0.12 * a).toFixed(3) + ')';
    ctx.beginPath(); ctx.moveTo(h.x, h.y); ctx.lineTo(x, y); ctx.stroke();
    ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(255,255,255,' + (0.45 * a).toFixed(3) + ')';
    ctx.beginPath(); ctx.moveTo(h.x, h.y); ctx.lineTo(x, y); ctx.stroke();
    hintDot(x, y, a, k);
    return;
  }
  var k2 = (t % 1.6) / 1.6, r = 10 + 30 * easeOutCubic(k2), a2 = 1 - k2;
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(70,15,30,' + (0.3 * a2).toFixed(3) + ')';
  ctx.beginPath(); ctx.arc(h.x, h.y, r, 0, TAU); ctx.stroke();
  ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(255,255,255,' + (0.9 * a2).toFixed(3) + ')';
  ctx.beginPath(); ctx.arc(h.x, h.y, r, 0, TAU); ctx.stroke();
  hintDot(h.x, h.y, 1, k2);
}
var HINT_AGAIN = 10; /* seconds idle before the hint comes back */
function hintNow() {
  if (!cur || !cur.hint) return null;
  if (touched && (now() - lastTouch) / 1000 < HINT_AGAIN) return null;
  var h = cur.hint();
  return h && isFinite(h.x) && isFinite(h.y) ? h : null;
}

function render(dt) {
  if (cur) { try { cur.update(dt); } catch (e) { err(e); } }
  fxUpdate(dt);
  intro = Math.min(1, intro + dt / 0.32);
  ctx.setTransform(G.dpr, 0, 0, G.dpr, 0, 0);
  ctx.globalAlpha = 1;
  ctx.clearRect(0, 0, G.W, G.H);
  if (!cur || G.W < 40 || G.H < 40) return;
  ctx.save();
  if (intro < 1) {
    var e = easeOutCubic(intro), s = 0.94 + 0.06 * e;
    ctx.globalAlpha = e;
    ctx.translate(G.W / 2, G.H / 2); ctx.scale(s, s); ctx.translate(-G.W / 2, -G.H / 2);
  }
  try { cur.draw(ctx); } catch (e2) { err(e2); }
  ctx.restore();
  ctx.setTransform(G.dpr, 0, 0, G.dpr, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  fxDraw(ctx);
  var h = hintNow();
  if (h) drawHint(h);
}
function frame(t) {
  raf = 0;
  var dt = clamp((t - last) / 1000, 0, 0.05);
  last = t;
  render(dt);
  schedule();
}
function schedule() { if (!raf && !document.hidden) raf = requestAnimationFrame(frame); }

document.addEventListener('visibilitychange', function () {
  if (document.hidden) {
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    if (S.ac && S.ac.state === 'running') { S.wasOn = true; try { S.ac.suspend(); } catch (e) {} }
  } else {
    if (S.ac && S.wasOn) { S.wasOn = false; try { S.ac.resume(); } catch (e) {} }
    last = now();
    schedule();
  }
});

/* No scrolling, zoom or selection */
var stop = function (e) { if (e.cancelable) e.preventDefault(); };
document.addEventListener('touchmove', stop, { passive: false });
document.addEventListener('gesturestart', stop, { passive: false });
document.addEventListener('gesturechange', stop, { passive: false });
document.addEventListener('dblclick', stop);
document.addEventListener('contextmenu', stop);
document.addEventListener('selectstart', stop);
document.addEventListener('touchend', function () { unlockAudio(); }, { passive: true });

$('tag').textContent = L.tag;
$('nextL').textContent = L.next;
$('getL').textContent = L.get;

window.addEventListener('resize', function () { measure(false); });
window.addEventListener('orientationchange', function () { measure(false); });
if (window.ResizeObserver) { try { new ResizeObserver(function () { measure(false); }).observe(play); } catch (e) {} }

/* ===== Set choice: random each load (never the previous one), ?set=N forces, ?game=K starts at K ===== */
var LS_KEY = 'xp_play_myfidget_last_set';
function setIds(s) {
  var out = [];
  if (!s || !s.length) return out;
  for (var i = 0; i < s.length && out.length < 3; i += 1) {
    var id = s[i];
    if (GAMES[id] && typeof GAMES[id].make === 'function' && out.indexOf(id) < 0) out.push(id);
  }
  return out.length === s.length ? out : [];
}
function chooseSet() {
  var list = SETS || [], valid = [], i;
  for (i = 0; i < list.length; i += 1) if (setIds(list[i]).length) valid.push(i);
  if (!valid.length) return -1;
  var forced = parseInt(Q.get('set'), 10), ix;
  if (forced >= 1 && valid.indexOf(forced - 1) >= 0) ix = forced - 1;
  else {
    var prev = -1;
    try { prev = parseInt(window.localStorage.getItem(LS_KEY), 10); } catch (e) {}
    var pool = [];
    for (i = 0; i < valid.length; i += 1) if (valid[i] !== prev) pool.push(valid[i]);
    if (!pool.length) pool = valid;
    ix = pool[Math.floor(Math.random() * pool.length)];
  }
  try { window.localStorage.setItem(LS_KEY, String(ix)); } catch (e) {}
  return ix;
}

if (Q.get('test') === '1') {
  window.__pf = {
    set: function () { return SET_IX + 1; },
    ids: function () { return ORDER.slice(); },
    game: function () { return pos + 1; },
    state: function () { try { return cur && cur.debug ? cur.debug() : null; } catch (e) { return null; } },
    /* extra helpers for headless tests (client coordinates) */
    hint: function () { var h = cur && cur.hint ? cur.hint() : null; var r = cv.getBoundingClientRect(); return h ? { x: r.left + h.x, y: r.top + h.y, dx: h.dx || 0, dy: h.dy || 0 } : null; },
    area: function () { var r = cv.getBoundingClientRect(); return { x: r.left, y: r.top, w: r.width, h: r.height, dpr: G.dpr, box: G.box }; },
    errors: function () { return errs; }
  };
}

SET_IX = chooseSet();
if (SET_IX < 0) {
  /* no valid set: fall back to whatever games exist */
  var all = [];
  for (var k in GAMES) if (Object.prototype.hasOwnProperty.call(GAMES, k) && all.length < 3) all.push(k);
  ORDER = all; SET_IX = 0;
} else {
  ORDER = setIds(SETS[SET_IX]);
}
measure(true);
if (ORDER.length) {
  var first = parseInt(Q.get('game'), 10);
  var p0 = first >= 1 && first <= ORDER.length ? first - 1 : 0;
  /* if the first game fails to start, try the next one in the set */
  for (var tries = 0; tries < ORDER.length; tries += 1) {
    if (startGame((p0 + tries) % ORDER.length, false)) break;
  }
  last = now();
  render(0);
}
if (!sentReady) { sentReady = true; post('ready'); }
schedule();
})();
</script>
