<!-- MyPocketGames 플레이어블 광고 껍데기(2026-10-11, My_Studio 세션). 게임은 _src/myminigame/games/<id>.js, 세트는 sets.js,
     build.py 가 아래 두 표시(CSS · GAMES)에 끼워 넣는다. 게임 만드는 법은 _src/myminigame/INTERFACE.md.
     앱 규칙: 외부 리소스 없음(앱 아이콘도 SVG 로 그림, tool/gen_icon.py 게임패드), 오른쪽 위 64x64 비움, XPromo 채널로 'ready' · 'switch:2' · 'switch:3' · 'install' 만.
     사용자 규칙(10/11): 남은 게임 수를 알 수 있는 표시 금지(점 · 2/3 · 숫자 없음), 세트 12개 이상 중 매번 무작위(직전 세트 제외).
     색은 앱 theme.dart 그대로: 바탕 #F6F7F4(다크 #0E110D) · 초록 #2FC85E · 글자 #12150F · 보조 #6B726A. 게임마다 대표색(catalog.dart). -->
<style>
:root {
  color-scheme: light dark;
  --bg: #F6F7F4; --outer: #E8EBE5; --surface: #FFFFFF; --ink: #12150F; --soft: #6B726A;
  --line: #D8DCD5; --hair: #EBEEEA; --green: #2FC85E; --green-ink: #1C9A46; --on-green: #06120A;
  --shadow: rgba(16,20,16,.10); --deco: .40;
  --u: 3.6px;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
  --font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Hiragino Sans", "Noto Sans JP", Roboto, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0E110D; --outer: #060806; --surface: #191D18; --ink: #F1F3EE; --soft: #9BA49A;
    --line: #3A4137; --hair: #2C332B; --green: #43D873; --green-ink: #43D873;
    --shadow: rgba(0,0,0,.35); --deco: .26;
  }
}
:lang(ja) { --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", "Apple SD Gothic Neo", Roboto, sans-serif; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; height: 100%; overflow: hidden; background: var(--outer); overscroll-behavior: none;
  touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-text-size-adjust: 100%;
}
body { position: fixed; inset: 0; font-family: var(--font); color: var(--ink); }
button { font: inherit; color: inherit; cursor: pointer; touch-action: none; -webkit-user-select: none; user-select: none; }
#stage { position: absolute; top: 0; bottom: 0; left: 0; right: 0; margin: 0 auto; width: 100%; overflow: hidden; background: var(--bg); }
#stage.boxed { box-shadow: 0 0 0 1px var(--hair), 0 0 60px var(--shadow); }
.deco { position: absolute; top: 0; bottom: 0; width: 20px; height: 100%; pointer-events: none; opacity: var(--deco); }
.deco.l { left: 0; } .deco.r { right: 0; }
#shell { position: absolute; inset: 0; display: flex; flex-direction: column; }
#fx { position: absolute; left: 0; top: 0; pointer-events: none; }

/* header: icon + brand. The top-right 64x64 stays empty for the app's close button. */
#hd { flex: none; display: flex; align-items: center; gap: 12px; padding: calc(var(--sat) + 12px) 72px 2px calc(var(--sal) + 16px); min-height: calc(var(--sat) + 70px); }
#hd .icon { width: 46px; height: 46px; border-radius: 23%; flex: none; display: block; overflow: hidden; box-shadow: 0 5px 14px rgba(28,154,70,.28); }
.ht { min-width: 0; line-height: 1.2; }
.ht > div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kick { font-size: 12.5px; font-weight: 800; color: var(--green-ink); letter-spacing: .01em; }
.nm { font-size: clamp(16px, calc(var(--u) * 4.9), 19px); font-weight: 900; letter-spacing: -.01em; }
.sb { font-size: 12.5px; font-weight: 600; color: var(--soft); }

/* game title: colour tile (like the home cards) + name + kind chip, tip below */
#gh { flex: none; display: flex; align-items: center; gap: 10px; padding: 8px calc(var(--sar) + 16px) 0 calc(var(--sal) + 16px); min-width: 0; }
#gh.swap { animation: swap .32s ease-out; }
@keyframes swap { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
#gtile { width: 42px; height: 42px; border-radius: 13px; flex: none; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px var(--shadow); }
#gtile svg { width: 23px; height: 23px; }
.gx { min-width: 0; flex: 1; }
.gt { display: flex; align-items: center; gap: 8px; min-width: 0; }
#gname { min-width: 0; font-size: 21px; font-weight: 900; white-space: nowrap; overflow: hidden; letter-spacing: -.01em; line-height: 1.2; }
#gkind { flex: none; font-size: 12px; font-weight: 800; padding: 3px 9px; border-radius: 999px; white-space: nowrap; color: var(--soft); background: var(--surface); border: 1px solid var(--line); }
#gtip { margin-top: 2px; font-size: 14.5px; font-weight: 600; color: var(--soft); white-space: nowrap; overflow: hidden; line-height: 1.3; }

/* play area: one canvas for the game, an optional DOM layer above it */
#area { position: relative; flex: 1; min-height: 0; margin: 8px 0 6px; }
#cv { position: absolute; left: 0; top: 0; display: block; touch-action: none; }
#ov { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
#flash { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: #FFFFFF; }
#flash.on { animation: flash var(--fd, .5s) ease-out forwards; }
@keyframes flash { from { opacity: var(--fa, .6); } to { opacity: 0; } }
#toast { position: absolute; left: 50%; top: 50%; max-width: calc(100% - 32px); transform: translate(-50%, -50%); padding: 10px 18px; border-radius: 999px; background: rgba(18,21,15,.82);
  color: #FFFFFF; font-size: 16px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; pointer-events: none; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
#toast.show { animation: toast var(--td, 1.6s) ease both; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, -40%) scale(.92); } 12% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  82% { opacity: 1; transform: translate(-50%, -50%); } 100% { opacity: 0; transform: translate(-50%, -58%); } }

/* bottom bar: "another game" + install. No dots, no counters (owner rule 10/11). */
#bar { flex: none; padding: 4px calc(var(--sar) + 16px) calc(var(--sab) + 14px) calc(var(--sal) + 16px); }
.btns { display: grid; grid-template-columns: minmax(max-content, 1fr) minmax(max-content, 1.2fr); gap: 10px; }
.btn { height: 54px; padding: 0 12px; border-radius: 18px; border: 0; display: flex; align-items: center; justify-content: center; gap: 8px;
  font-weight: 800; font-size: 16.5px; transition: transform .12s; position: relative; overflow: hidden; white-space: nowrap; }
.btn:active { transform: scale(.96); }
.btn svg { width: 1.15em; height: 1.15em; flex: none; }
#bOther { background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); }
#bInstall { background: var(--green); color: var(--on-green); box-shadow: 0 8px 22px rgba(47,200,94,.32), inset 0 1px 0 rgba(255,255,255,.3); }
#bInstall::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%; pointer-events: none;
  background: linear-gradient(100deg, rgba(255,255,255,0), rgba(255,255,255,.42), rgba(255,255,255,0)); animation: shine 3.4s ease-in-out 1.2s infinite; }
@keyframes shine { 0% { left: -60%; } 30%, 100% { left: 130%; } }

@media (max-width: 340px) {
  #hd { gap: 10px; } #hd .icon { width: 42px; height: 42px; }
  .btn { font-size: 15.5px; padding: 0 10px; gap: 6px; }
  #gtile { width: 38px; height: 38px; border-radius: 12px; } #gtile svg { width: 21px; height: 21px; }
}
@media (max-height: 620px) {
  /* 62 + the title row's 4 px top padding keeps the kind chip below the app's 64x64 close button */
  #hd { min-height: calc(var(--sat) + 62px); padding-top: calc(var(--sat) + 8px); } #hd .icon { width: 40px; height: 40px; } .sb { display: none; }
  #gh { padding-top: 4px; } #gtile { width: 36px; height: 36px; } #gtip { font-size: 13.5px; }
  #area { margin: 6px 0 4px; } .btn { height: 48px; } #bar { padding-bottom: calc(var(--sab) + 10px); }
}
/* 2026-10-23 demo lock (owner: games could be played to the end): 30 s of play per game after the first touch, then the
   game freezes under a blur and the card sends to the store. The bottom bar stays ("another game" gets a fresh 30 s). */
#lock { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 0 20px; opacity: 0; pointer-events: none;
  background: color-mix(in srgb, var(--bg) 55%, transparent); -webkit-backdrop-filter: blur(7px); backdrop-filter: blur(7px); transition: opacity .35s ease; }
#lock.on { opacity: 1; pointer-events: auto; }
#lock .card { width: 100%; max-width: 330px; padding: 22px 20px 20px; border-radius: 24px; background: var(--surface); border: 1px solid var(--line);
  box-shadow: 0 18px 48px var(--shadow); text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; transform: translateY(10px) scale(.96); transition: transform .4s cubic-bezier(.2,1.4,.4,1); }
#lock.on .card { transform: none; }
#lock .lk { width: 54px; height: 54px; border-radius: 23%; overflow: hidden; box-shadow: 0 5px 14px rgba(28,154,70,.28); }
#lock .lt { font-size: 20px; font-weight: 900; letter-spacing: -.01em; line-height: 1.25; }
#lock .ls { font-size: 14.5px; font-weight: 600; color: var(--soft); line-height: 1.35; }
#lock .btn { width: 100%; margin-top: 8px; background: var(--green); color: var(--on-green); box-shadow: 0 8px 22px rgba(47,200,94,.32), inset 0 1px 0 rgba(255,255,255,.3); }
/*@@CSS@@*/
</style>

      // play-area rect in viewport px, and the current hint point in viewport px (handy for headless taps)
      area: function () { var r = cv.getBoundingClientRect(); return { x: r.left, y: r.top, w: r.width, h: r.height }; },
      hint: function () { var h = cur && cur.api.hint ? call('hint') : null, r = cv.getBoundingClientRect(); return h ? { x: r.left + h.x, y: r.top + h.y, dx: h.dx || 0, dy: h.dy || 0 } : null; }
    };
  }

  pageLayout();
  var qg = parseInt(Q.get('game'), 10);
  var started = ids.length ? show(qg >= 1 && qg <= ids.length ? qg : 1, false) : 0;
  last = 0;
  schedule();
  // 'ready' once the first game has drawn its first frame (synchronously above, so it also works in a
  // WebView that is warming up off screen where requestAnimationFrame may not run yet)
  if (started && !readySent) { readySent = true; post('ready'); }
})();
</script>
</body>
</html>
