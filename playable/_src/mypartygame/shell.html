     Each load picks one set of 3 games at random (never the same set twice in a row), ?set=N forces one, ?game=K starts at position K.
     Nothing on screen shows how many games are left (owner rule 10/11). Bridge: window.XPromo.postMessage 'ready' | 'switch:2' | 'switch:3' | 'install'.
     The top-right 64x64 stays empty for the app's close button. Query: lang=ko|ja|en|zh-Hant|de|es|fr|pt|ar, from=<app>, host=app, set=N, game=K, test=1. -->

html, body {

  }
  var valid = [];
  for (var si = 0; si < SETS_ALL.length; si++) if (validSet(SETS_ALL[si])) valid.push(si);
  var LS_KEY = 'mypartygame_playable_lastset';
  var setIdx = -1, ids = null;
  var qs = parseInt(Q.get('set'), 10);
  if (qs >= 1 && valid.indexOf(qs - 1) >= 0) setIdx = qs - 1;
  else if (valid.length) {
    var last = -1;
    try { var lv = localStorage.getItem(LS_KEY); if (lv != null) last = parseInt(lv, 10); } catch (e) {}
    var choices = valid.filter(function (i) { return i !== last; });
    if (!choices.length) choices = valid;
    setIdx = choices[rnd(choices.length)];
  }
  if (setIdx >= 0) ids = SETS_ALL[setIdx].slice();
  else {
    // no usable set (should not happen: build.py checks): take the first three registered games
    ids = Object.keys(GAMES).filter(function (k) { return GAMES[k] && typeof GAMES[k].make === 'function'; }).slice(0, 3);
  }
  try { if (setIdx >= 0) localStorage.setItem(LS_KEY, String(setIdx)); } catch (e) {}

  /* ---------- showing a game ---------- */
  var pos = 1, ctxNow = null, chip = $('gchip');
  var qg = parseInt(Q.get('game'), 10);
  if (qg >= 1 && qg <= ids.length) pos = qg;

  $('nm').textContent = t.name;
  $('sb').textContent = t.sub;
  $('tOther').textContent = t.other;
  $('tInstall').textContent = t.install;

  function paintChip() {
    var def = GAMES[ids[pos - 1]], acc = (def && def.accent) || '#2FC85E';
    chip.style.background = rgba(acc, DARK ? 0.24 : 0.16);
    chip.style.borderColor = rgba(acc, DARK ? 0.5 : 0.45);
  }
  function chipText(def, short) {
    var parts = [];
    if (def.chip) parts.push(pick(def.chip));
    else {
      if (def.cat && t.cat[def.cat]) parts.push(t.cat[def.cat]);
      if (!short && def.who && t.who[def.who]) parts.push(t.who[def.who]);
    }
    return parts.join(t.sep);
  }

  // title row at narrow widths (320 px with a long name like 'Crocodile Teeth'): shrink the chip, then drop its 'who' part;
  // the name and the tip line shrink a little instead of being cut with an ellipsis
  var gnameEl = $('gname'), ghintEl = $('ghint');
  function over(e) { return e.scrollWidth > e.clientWidth + 0.5; }
  function shrink(e, min) {
    e.style.fontSize = '';
    var fs = parseFloat(getComputedStyle(e).fontSize) || 14;
    while (over(e) && fs > min) { fs = Math.max(min, fs - 0.5); e.style.fontSize = fs + 'px'; }
  }
  function fitTitle() {
    var def = GAMES[ids[pos - 1]];
    if (!def) return;
    shrink(gnameEl, 15);
    chip.textContent = chipText(def, false);
    shrink(chip, 9.5);
    if (over(chip) && !def.chip && def.who) { chip.textContent = chipText(def, true); shrink(chip, 9.5); }
    shrink(ghintEl, 11);
  }

  function teardown() {
    if (active) { try { if (active.destroy) active.destroy(); } catch (e) { if (window.console) console.error(e); } }
    active = null;
    if (ctxNow) ctxNow._dispose();
    ctxNow = null;
    area.innerHTML = '';
    fx.clear();
  }

  // builds game `n` of the set; a game that throws while starting is skipped (the next one shows instead)
  function show(n) {
    teardown();
    for (; n <= ids.length; n++) {
      var id = ids[n - 1], def = GAMES[id];
      pos = n;
      $('gname').textContent = pick(def.name);
      chip.textContent = chipText(def);
      $('ghint').textContent = pick(def.tip);
      paintChip();
      fitTitle();
      var acc = def.accent || '#2FC85E';
      var el = mk('div', 'g g-' + id + (def.full ? ' full' : ''));
      el.style.setProperty('--acc', acc);
      el.style.setProperty('--acc-ink', inkOn(acc));
      el.style.setProperty('--acc-soft', rgba(acc, DARK ? 0.24 : 0.16));
      el.style.setProperty('--acc-glow', rgba(acc, 0.32));
      area.appendChild(el);
      ctxNow = makeCtx(id, def, n, el);
      frameBroken = false;
      try {
        active = def.make(ctxNow) || {};
        if (active.resize) active.resize();
        ctxNow._hint.place();
        el.classList.add('enter');
        wake();
        return true;
      } catch (e) {
        if (window.console) console.error('game ' + id + ' failed to start', e);
        teardown();
      }
    }
    return false;
  }

  function layout() {
    var vw = window.innerWidth, vh = window.innerHeight;
    var w = vw / vh > 0.62 ? Math.round(vh * 9 / 16) : vw;
    stage.style.width = w + 'px';
    stage.classList.toggle('boxed', w < vw);
    document.documentElement.style.setProperty('--u', (w / 100).toFixed(3) + 'px');
    if (ids && ids.length) fitTitle();
    fx.resize();
    if (active && active.resize) { try { active.resize(); } catch (e) { if (window.console) console.error(e); } }
    if (ctxNow) ctxNow._hint.place();
  }
  var resizeTimer = 0;
  window.addEventListener('resize', function () {
    if (resizeTimer) return;
    resizeTimer = setTimeout(function () { resizeTimer = 0; layout(); wake(); }, 60);
  });
  // light / dark follows the device
  if (mq) {
    var onScheme = function () {
      DARK = mq.matches; paintChip();
      if (ctxNow) { var acc = ctxNow.accent; ctxNow.el.style.setProperty('--acc-soft', rgba(acc, DARK ? 0.24 : 0.16)); }
      if (active && active.redraw) { try { active.redraw(); } catch (e) {} }
      wake();
    };
    if (mq.addEventListener) mq.addEventListener('change', onScheme); else if (mq.addListener) mq.addListener(onScheme);
  }

  var lastOther = 0;
  $('bOther').addEventListener('click', function () {
    var now = Date.now();
    if (now - lastOther < 350) return;
    lastOther = now;
    S.click(); buzz();
    if (pos < ids.length) { if (show(pos + 1)) post('switch:' + pos); else install(); }
    else install();
  });
  $('bInstall').addEventListener('click', function () { buzz(); install(); });

  // first tap unlocks audio; no scrolling, pinch zoom, double-tap zoom or long-press menu
  window.addEventListener('xpromo-shown', function () { S.unlock(); S.resume(); });
  window.addEventListener('xpromo-hidden', function () { var c = S.ctx(); if (c && c.suspend) c.suspend()['catch'](function () {}); });
  window.xpromoShown = function () { window.dispatchEvent(new Event('xpromo-shown')); };  // apps may call these instead of dispatching the events
  window.xpromoHidden = function () { window.dispatchEvent(new Event('xpromo-hidden')); };
  document.addEventListener('pointerdown', S.unlock, true);
  document.addEventListener('touchend', S.unlock, true);
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (ev) { document.addEventListener(ev, function (e) { e.preventDefault(); }, { passive: false }); });
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  if (TEST) {
    window.__pf = {
      set: function () { return setIdx + 1; },
      ids: function () { return ids.slice(); },
      game: function () { return pos; },
      state: function () { try { return active && active.debug ? active.debug() : null; } catch (e) { return null; } }
    };
  }

  layout();
  if (ids.length && show(pos)) post('ready');
})();
</script>
</body>
</html>
