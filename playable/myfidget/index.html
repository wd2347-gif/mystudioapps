#hint{flex:none;display:flex;align-items:center;justify-content:center;gap:8px;min-width:0;padding:2px 16px 2px}
#gname{flex:none;font-size:12.5px;line-height:16px;font-weight:800;padding:4px 10px;border-radius:999px;white-space:nowrap}
#gtip{min-width:0;font-size:14.5px;line-height:20px;font-weight:600;color:var(--tip);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hint.swap{animation:hin .35s ease-out}
@keyframes hin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#play{flex:1 1 auto;position:relative;min-height:0}
#cv{position:absolute;left:0;top:0;display:block;touch-action:none}
#layer{position:absolute;left:0;top:0;right:0;bottom:0;overflow:hidden;pointer-events:none}

#toast.show{animation:toast 1.9s ease both}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-40%) scale(.92)}12%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0;transform:translate(-50%,-58%)}}
#bar{flex:none;padding:6px calc(16px + env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}

button{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:7px;height:52px;border:0;border-radius:16px;font:inherit;font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;cursor:pointer;transition:transform .12s,background .3s,color .3s;touch-action:manipulation}

button svg{width:18px;height:18px;flex:none}
#next{background:var(--btn);color:var(--btnInk);box-shadow:inset 0 0 0 1px var(--btnRing)}
#get{flex:1.25;position:relative;color:#fff;background:linear-gradient(180deg,#FF7A68 0%,#E8434D 100%);box-shadow:0 8px 22px rgba(232,67,77,.38),inset 0 1px 0 rgba(255,255,255,.25)}

@keyframes shine{0%{left:-60%}35%,100%{left:130%}}
@media (max-width:340px){button{font-size:15px}#next svg{display:none}#hint{gap:6px;padding-left:12px;padding-right:12px}#gname{font-size:11.5px;padding:3px 8px}#gtip{font-size:13.5px}}
@media (max-height:560px){#top{min-height:56px;padding-bottom:8px}#hint{padding-top:0}button{height:46px}}

        c.strokeStyle = 'rgba(255,255,255,0.4)'; c.lineWidth = r * 0.07; c.beginPath(); c.arc(cx, cy, r * 0.92, 0, TAU); c.stroke();
        c.fillStyle = 'rgba(255,255,255,0.55)'; c.beginPath(); c.ellipse(cx - r * 0.3, cy - r * 0.4, r * 0.31, r * 0.15, 0, 0, TAU); c.fill();
      },
      /* a flick across the top wing */
      hint: function () { return { x: cx - R * 0.6, y: cy - R * 0.78, dx: R * 1.2, dy: 0 }; },
      debug: function () { return { om: Math.round(om * 100) / 100, th: Math.round(th * 100) / 100, speed: Math.round(speed * 10) / 10, lit: lit, goals: goals, autos: autos, whirr: !!wh }; },
      destroy: function () { if (wh) wh.stop(); wh = null; grabs = {}; caps = {}; sparks = []; body = null; shadow = null; }
    };
  }

  GAMES['spinner'] = {
    name: { ko: '피젯 스피너', ja: 'ハンドスピナー', en: 'Fidget Spinner', 'zh-Hant': '指尖陀螺', 'de': 'Fidget Spinner', 'es': 'Fidget spinner', 'fr': 'Hand spinner', 'pt': 'Fidget spinner', 'ar': 'سبينر' },
    tip: { ko: '휙 튕겨서 돌려 보세요', ja: 'はじいて回してみて', en: 'Flick it to spin', 'zh-Hant': '用力一撥，轉起來', 'de': 'Schnipp ihn an, damit er sich dreht', 'es': 'Dale un toque para girarlo', 'fr': 'Donne une pichenette pour le faire tourner', 'pt': 'Dê um peteleco para girar', 'ar': 'انقره ليدور' },
    bg: 'linear-gradient(180deg,' + TOP + ' 0%,' + BOT + ' 100%) ' + TOP,
    tone: 'light',
    top: TOP,
    accent: '#3CC48A',
    make: Spinner
  };
})();

/* MyFidget playable sets: [opener, 2nd, 3rd]. One set is picked at random per load (never the previous one).
 * Rules: 3 different games, no repeated trio, every pool game in 2+ sets, openers are instantly readable,
 * no two games of the same kind in one set (pop/press, spin, swipe/rub, squish, break, visual, music). */
var SETS = [
  ['bubble_wrap', 'fireworks', 'kalimba'],
  ['popit', 'scratch', 'plinko'],
  ['fireworks', 'jelly', 'keycaps'],
  ['spinner', 'powerwash', 'popit'],
  ['ice', 'plinko', 'bubble_wrap'],
  ['jelly', 'soapcut', 'fireworks'],
  ['scratch', 'keycaps', 'ice'],
  ['plinko', 'spinner', 'soapcut'],
  ['keycaps', 'powerwash', 'jelly'],
  ['popit', 'kalimba', 'ice'],
  ['bubble_wrap', 'soapcut', 'spinner'],
  ['powerwash', 'fireworks', 'popit'],
  ['fireworks', 'scratch', 'kalimba'],
  ['ice', 'jelly', 'kalimba']
];

/* ===== Harness ===== */
var DEFAULT_BG = 'radial-gradient(120% 55% at 50% 40%,#3A1A22 0%,#27121A 55%,#1C0D13 100%) #1C0D13';
var DEFAULT_ACCENT = '#FF6F61';
var stage = $('stage'), play = $('play'), cv = $('cv'), ctx = cv.getContext('2d'), layer = $('layer');
var bgA = $('bgA'), bgB = $('bgB'), bgFront = bgA, themeMeta = document.querySelector('meta[name="theme-color"]');
var ORDER = [], SET_IX = 0, pos = 0, cur = null, curId = '', curDef = null;
var intro = 1, touched = false, lastTouch = 0, rect = null, raf = 0, last = 0, errs = 0, accRGB = hex(DEFAULT_ACCENT), sentReady = false;

function err(e) { errs += 1; if (errs <= 8 && window.console) console.error(e); }

var ENV = {
  layer: layer,
  lang: LANG,
  T: T,
  /* seconds since the viewer last touched the play area (or since this game started) */
  idle: function () { return (now() - lastTouch) / 1000; },
  touched: function () { return touched; }
};

function measure(force) {
  var iw = window.innerWidth || document.documentElement.clientWidth || 360;
  var ih = window.innerHeight || document.documentElement.clientHeight || 640;
  /* phones: full width. Tablets / landscape: a centred column, never wider than the screen */
  var sw = Math.min(iw, Math.max(Math.round(ih * 9 / 16), Math.min(Math.round(ih * 0.82), 640)));
  if (stage.__sw !== sw) { stage.style.width = sw + 'px'; stage.__sw = sw; }
  var wide = sw < iw - 1;
  document.body.classList.toggle('wide', wide);
  var r = play.getBoundingClientRect();
  rect = r;
  var w = Math.max(1, Math.round(r.width)), h = Math.max(1, Math.round(r.height));
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (w * h * dpr * dpr > 2.6e6) dpr = Math.max(1, Math.sqrt(2.6e6 / (w * h)));
  if (force || w !== G.W || h !== G.H || dpr !== G.dpr || wide !== G.wide || iw !== G.sw) {
    G.W = w; G.H = h; G.dpr = dpr; G.wide = wide; G.sw = iw;
    var bw = Math.min(w, Math.max(280, Math.round(h * 0.8)));
    G.box = { x: Math.round((w - bw) / 2), y: 0, w: bw, h: h };
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    cv.style.width = w + 'px'; cv.style.height = h + 'px';
    safeLayout();
  }
}
function safeLayout() {
  if (!cur) return;
  try { cur.layout(Math.max(G.W, 160), Math.max(G.H, 160), G.box); } catch (e) { err(e); }
}

function setBg(css, animate) {
  css = css || DEFAULT_BG;
  if (!animate) {
    bgFront.style.background = css; bgFront.style.zIndex = '1'; bgFront.style.opacity = '1';
    var other = bgFront === bgA ? bgB : bgA; other.style.zIndex = '0';
    return;
  }
  var back = bgFront === bgA ? bgB : bgA;
  bgFront.style.zIndex = '0';
  back.style.transition = 'none'; back.style.opacity = '0'; back.style.background = css; back.style.zIndex = '1';
  void back.offsetWidth;
  back.style.transition = ''; back.style.opacity = '1';
  bgFront = back;
}

function applyLook(def, animate) {
  setBg(def.bg, animate);
  var light = def.tone === 'light';
  document.body.classList.toggle('light', light);
  var acc = /^#[0-9a-fA-F]{6}$/.test(def.accent || '') ? def.accent : DEFAULT_ACCENT;
  accRGB = hex(acc);
  var chip = $('gname');
  chip.style.background = rgba(acc, light ? 0.16 : 0.18);
  chip.style.boxShadow = 'inset 0 0 0 1px ' + rgba(acc, light ? 0.45 : 0.38);
  chip.style.color = light ? mix(acc, [30, 12, 18], 0.5) : mix(acc, WHITE, 0.75);
  if (themeMeta) themeMeta.setAttribute('content', def.top || (light ? '#FFF4EF' : '#1C0D13'));
}

function setUI(animate) {
  $('gname').textContent = T(curDef.name);
  $('gtip').textContent = T(curDef.tip);
  var hint = $('hint');
  hint.classList.remove('swap');
  if (animate) { void hint.offsetWidth; hint.classList.add('swap'); }
}

function EMPTY() { return { layout: function () {}, down: function () {}, move: function () {}, up: function () {}, update: function () {}, draw: function () {} }; }

function startGame(p, animate) {
  if (cur && cur.destroy) { try { cur.destroy(); } catch (e) { err(e); } }
  cur = null;
  stopLoops();
  FX.length = 0;
  toastEl.classList.remove('show');
  layer.innerHTML = '';
  if (curId) document.body.classList.remove('g-' + curId);
  pos = p; curId = ORDER[p]; curDef = GAMES[curId];
  document.body.classList.add('g-' + curId);
  applyLook(curDef, animate);
  setUI(animate);
  var g = null;
  try { g = curDef.make(ENV); } catch (e) { err(e); }
  cur = g || EMPTY();
  measure(true);
  intro = animate ? 0 : 1; touched = false; lastTouch = now();
  return !!g;
}

/* Pointer input: play-area CSS px, multi-touch, one id per finger */
function pt(e) { var r = rect || cv.getBoundingClientRect(); return { id: e.pointerId, x: e.clientX - r.left, y: e.clientY - r.top, t: now() }; }
function call(fn, p) { if (cur && cur[fn]) { try { cur[fn](p); } catch (x) { err(x); } } }
cv.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  rect = cv.getBoundingClientRect();
  unlockAudio();
  try { cv.setPointerCapture(e.pointerId); } catch (x) {}
  touched = true; lastTouch = now();
  call('down', pt(e));
});
cv.addEventListener('pointermove', function (e) { if (e.buttons || e.pointerType === 'touch') lastTouch = now(); call('move', pt(e)); });
cv.addEventListener('pointerup', function (e) { unlockAudio(); lastTouch = now(); call('up', pt(e)); });
cv.addEventListener('pointercancel', function (e) { call('up', pt(e)); });
cv.addEventListener('lostpointercapture', function (e) { call('up', pt(e)); });

var lastSwitch = -1e9;
$('next').addEventListener('click', function () {
  unlockAudio(); haptic(true);
  var t = now();
  if (t - lastSwitch < 280) return;
  lastSwitch = t;
  if (pos >= ORDER.length - 1) { install(); return; }
  Sfx.ui();
  startGame(pos + 1, true);
  post('switch:' + (pos + 1));
});
$('get').addEventListener('click', function () { unlockAudio(); haptic(true); install(); });

/* Touch hint: pulse at {x,y}, or a finger sliding from {x,y} by {dx,dy} */
function hintDot(x, y, a, k) {
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(70,15,30,' + (0.3 * a).toFixed(3) + ')';
  ctx.beginPath(); ctx.arc(x, y, 14, 0, TAU); ctx.stroke();
  ctx.fillStyle = 'rgba(' + accRGB[0] + ',' + accRGB[1] + ',' + accRGB[2] + ',' + ((0.5 + 0.15 * Math.sin(k * TAU)) * a).toFixed(3) + ')';
  ctx.beginPath(); ctx.arc(x, y, 12, 0, TAU); ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,' + (0.9 * a).toFixed(3) + ')'; ctx.stroke();
}
function drawHint(h) {
  var t = now() / 1000;
  if (h.dx || h.dy) {
    var P = 1.9, u = t % P, k = clamp(u / 1.25, 0, 1), e = easeInOut(k), a = u < 1.25 ? Math.min(1, u / 0.2) : Math.max(0, 1 - (u - 1.25) / 0.5);
    var x = h.x + h.dx * e, y = h.y + h.dy * e;
    ctx.lineCap = 'round';
    ctx.lineWidth = 12; ctx.strokeStyle = 'rgba(70,15,30,' + (0.12 * a).toFixed(3) + ')';
    ctx.beginPath(); ctx.moveTo(h.x, h.y); ctx.lineTo(x, y); ctx.stroke();
    ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(255,255,255,' + (0.45 * a).toFixed(3) + ')';
    ctx.beginPath(); ctx.moveTo(h.x, h.y); ctx.lineTo(x, y); ctx.stroke();
    hintDot(x, y, a, k);
    return;
  }
  var k2 = (t % 1.6) / 1.6, r = 10 + 30 * easeOutCubic(k2), a2 = 1 - k2;
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(70,15,30,' + (0.3 * a2).toFixed(3) + ')';
  ctx.beginPath(); ctx.arc(h.x, h.y, r, 0, TAU); ctx.stroke();
  ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(255,255,255,' + (0.9 * a2).toFixed(3) + ')';
  ctx.beginPath(); ctx.arc(h.x, h.y, r, 0, TAU); ctx.stroke();
  hintDot(h.x, h.y, 1, k2);
}
var HINT_AGAIN = 10; /* seconds idle before the hint comes back */
function hintNow() {
  if (!cur || !cur.hint) return null;
  if (touched && (now() - lastTouch) / 1000 < HINT_AGAIN) return null;
  var h = cur.hint();
  return h && isFinite(h.x) && isFinite(h.y) ? h : null;
}

function render(dt) {
  if (cur) { try { cur.update(dt); } catch (e) { err(e); } }
  fxUpdate(dt);
  intro = Math.min(1, intro + dt / 0.32);
  ctx.setTransform(G.dpr, 0, 0, G.dpr, 0, 0);
  ctx.globalAlpha = 1;
  ctx.clearRect(0, 0, G.W, G.H);
  if (!cur || G.W < 40 || G.H < 40) return;
  ctx.save();
  if (intro < 1) {
    var e = easeOutCubic(intro), s = 0.94 + 0.06 * e;
    ctx.globalAlpha = e;
    ctx.translate(G.W / 2, G.H / 2); ctx.scale(s, s); ctx.translate(-G.W / 2, -G.H / 2);
  }
  try { cur.draw(ctx); } catch (e2) { err(e2); }
  ctx.restore();
  ctx.setTransform(G.dpr, 0, 0, G.dpr, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  fxDraw(ctx);
  var h = hintNow();
  if (h) drawHint(h);
}
function frame(t) {
  raf = 0;
  var dt = clamp((t - last) / 1000, 0, 0.05);
  last = t;
  render(dt);
  schedule();
}
function schedule() { if (!raf && !document.hidden) raf = requestAnimationFrame(frame); }

document.addEventListener('visibilitychange', function () {
  if (document.hidden) {
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    if (S.ac && S.ac.state === 'running') { S.wasOn = true; try { S.ac.suspend(); } catch (e) {} }
  } else {
    if (S.ac && S.wasOn) { S.wasOn = false; try { S.ac.resume(); } catch (e) {} }
    last = now();
    schedule();
  }
});

/* No scrolling, zoom or selection */
var stop = function (e) { if (e.cancelable) e.preventDefault(); };
document.addEventListener('touchmove', stop, { passive: false });
document.addEventListener('gesturestart', stop, { passive: false });
document.addEventListener('gesturechange', stop, { passive: false });
document.addEventListener('dblclick', stop);
document.addEventListener('contextmenu', stop);
document.addEventListener('selectstart', stop);
document.addEventListener('touchend', function () { unlockAudio(); }, { passive: true });

$('tag').textContent = L.tag;
$('nextL').textContent = L.next;
$('getL').textContent = L.get;

window.addEventListener('resize', function () { measure(false); });
window.addEventListener('orientationchange', function () { measure(false); });
if (window.ResizeObserver) { try { new ResizeObserver(function () { measure(false); }).observe(play); } catch (e) {} }

/* ===== Set choice: random each load (never the previous one), ?set=N forces, ?game=K starts at K ===== */
var LS_KEY = 'xp_play_myfidget_last_set';
function setIds(s) {
  var out = [];
  if (!s || !s.length) return out;
  for (var i = 0; i < s.length && out.length < 3; i += 1) {
    var id = s[i];
    if (GAMES[id] && typeof GAMES[id].make === 'function' && out.indexOf(id) < 0) out.push(id);
  }
  return out.length === s.length ? out : [];
}
function chooseSet() {
  var list = SETS || [], valid = [], i;
  for (i = 0; i < list.length; i += 1) if (setIds(list[i]).length) valid.push(i);
  if (!valid.length) return -1;
  var forced = parseInt(Q.get('set'), 10), ix;
  if (forced >= 1 && valid.indexOf(forced - 1) >= 0) ix = forced - 1;
  else {
    var prev = -1;
    try { prev = parseInt(window.localStorage.getItem(LS_KEY), 10); } catch (e) {}
    var pool = [];
    for (i = 0; i < valid.length; i += 1) if (valid[i] !== prev) pool.push(valid[i]);
    if (!pool.length) pool = valid;
    ix = pool[Math.floor(Math.random() * pool.length)];
  }
  try { window.localStorage.setItem(LS_KEY, String(ix)); } catch (e) {}
  return ix;
}

if (Q.get('test') === '1') {
  window.__pf = {
    set: function () { return SET_IX + 1; },
    ids: function () { return ORDER.slice(); },
    game: function () { return pos + 1; },
    state: function () { try { return cur && cur.debug ? cur.debug() : null; } catch (e) { return null; } },
    /* extra helpers for headless tests (client coordinates) */
    hint: function () { var h = cur && cur.hint ? cur.hint() : null; var r = cv.getBoundingClientRect(); return h ? { x: r.left + h.x, y: r.top + h.y, dx: h.dx || 0, dy: h.dy || 0 } : null; },
    area: function () { var r = cv.getBoundingClientRect(); return { x: r.left, y: r.top, w: r.width, h: r.height, dpr: G.dpr, box: G.box }; },
    errors: function () { return errs; }
  };
}

SET_IX = chooseSet();
if (SET_IX < 0) {
  /* no valid set: fall back to whatever games exist */
  var all = [];
  for (var k in GAMES) if (Object.prototype.hasOwnProperty.call(GAMES, k) && all.length < 3) all.push(k);
  ORDER = all; SET_IX = 0;
} else {
  ORDER = setIds(SETS[SET_IX]);
}
measure(true);
if (ORDER.length) {
  var first = parseInt(Q.get('game'), 10);
  var p0 = first >= 1 && first <= ORDER.length ? first - 1 : 0;
  /* if the first game fails to start, try the next one in the set */
  for (var tries = 0; tries < ORDER.length; tries += 1) {
    if (startGame((p0 + tries) % ORDER.length, false)) break;
  }
  last = now();
  render(0);
}
if (!sentReady) { sentReady = true; post('ready'); }
schedule();
})();
</script>
