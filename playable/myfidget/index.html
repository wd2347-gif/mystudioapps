<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#24111A">
<meta name="robots" content="noindex">
<title>MyFidget</title>
<link rel="icon" href="/assets/myfidget/icon.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;left:0;top:0;right:0;bottom:0;color:#FFF1EE;background:#150A0F radial-gradient(90% 60% at 50% 0%,#4A1E27 0%,#22111A 60%,#150A0F 100%);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans KR","Noto Sans JP","Malgun Gothic","Yu Gothic",Roboto,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none;-webkit-text-size-adjust:100%}
#stage{position:absolute;top:0;bottom:0;left:50%;width:100%;transform:translateX(-50%);display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(120% 55% at 50% 40%,#3A1A22 0%,#27121A 55%,#1C0D13 100%)}
.wide #stage{box-shadow:0 0 0 1px rgba(255,255,255,.06),0 0 70px rgba(0,0,0,.5)}
#top{flex:none;display:flex;align-items:center;gap:10px;min-height:52px;padding:max(12px,env(safe-area-inset-top)) calc(72px + env(safe-area-inset-right)) 0 calc(16px + env(safe-area-inset-left))}
#icon{width:40px;height:40px;border-radius:11px;flex:none;background:#FCD9CF;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.brand{min-width:0;display:flex;flex-direction:column;line-height:1.25}
.brand b{font-size:17px;font-weight:800;letter-spacing:-.01em}
.brand span{font-size:12.5px;font-weight:600;color:#F7B4A8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hint{flex:none;display:flex;align-items:center;justify-content:center;gap:8px;min-width:0;padding:12px 16px 2px}
#gname{flex:none;font-size:12.5px;font-weight:800;color:#FFD9D2;background:rgba(255,111,97,.18);box-shadow:inset 0 0 0 1px rgba(255,140,125,.35);padding:4px 10px;border-radius:999px}
#gtip{min-width:0;font-size:14.5px;font-weight:600;color:#FFE9E4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hint.swap{animation:hin .35s ease-out}
@keyframes hin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#play{flex:1 1 auto;position:relative;min-height:0}
#cv{position:absolute;left:0;top:0;display:block;touch-action:none}
#toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:10px 18px;border-radius:999px;background:rgba(30,12,18,.8);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 10px 30px rgba(0,0,0,.35);font-size:15px;font-weight:800;white-space:nowrap;opacity:0;pointer-events:none}
#toast.show{animation:toast 1.9s ease both}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-40%) scale(.92)}12%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0;transform:translate(-50%,-58%)}}
#bar{flex:none;padding:6px calc(16px + env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
#dots{display:flex;justify-content:center;gap:6px;margin-bottom:10px}
#dots i{width:6px;height:6px;border-radius:3px;background:rgba(255,241,238,.28);transition:width .25s,background .25s}
#dots i.on{width:18px;background:#FF7A6B}
.row{display:flex;gap:10px}
button{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:7px;height:52px;border:0;border-radius:16px;font:inherit;font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;cursor:pointer;transition:transform .12s;touch-action:manipulation}
button:active{transform:scale(.97)}
button svg{width:18px;height:18px;flex:none}
#next{background:rgba(255,241,238,.08);color:#FFE9E4;box-shadow:inset 0 0 0 1px rgba(255,241,238,.16)}
#get{flex:1.25;position:relative;color:#fff;background:linear-gradient(180deg,#FF7A68 0%,#E8434D 100%);box-shadow:0 8px 22px rgba(232,67,77,.38),inset 0 1px 0 rgba(255,255,255,.25)}
#get::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.35),rgba(255,255,255,0));animation:shine 3.2s ease-in-out 1.2s infinite;pointer-events:none}
@keyframes shine{0%{left:-60%}35%,100%{left:130%}}
@media (max-width:340px){button{font-size:15px}#next svg{display:none}#hint{gap:6px;padding-left:12px;padding-right:12px}#gname{font-size:11.5px;padding:3px 8px}#gtip{font-size:13.5px}}
@media (max-height:560px){#hint{padding-top:6px}#dots{margin-bottom:6px}button{height:46px}}
</style>
</head>

  <div id="hint"><span id="gname"></span><span id="gtip"></span></div>
  <div id="play"><canvas id="cv"></canvas><div id="toast"></div></div>

    <div class="row">

    </div>
  </footer>
</div>

    var bw = Math.min(w - m * 2, 420), pad = bw * 0.07, g = bw * 0.035, s = (bw - pad * 2 - g * 2) / 3, sh = s * 0.8;
    var bh = pad * 2 + s * 3 + g * 3 + sh;
    if (bh > h - m * 2) { var k = (h - m * 2) / bh; bw *= k; pad *= k; g *= k; s *= k; sh *= k; bh *= k; }
    board = { x: (w - bw) / 2, y: (h - bh) / 2, w: bw, h: bh, pad: pad, g: g };
    for (var i = 0; i < 9; i += 1) {
      var key = keys[i];
      key.x = board.x + pad + (i % 3) * (s + g); key.y = board.y + pad + Math.floor(i / 3) * (s + g); key.w = s; key.h = s;
    }
    var sp = keys[9];
    sp.x = board.x + pad; sp.y = board.y + pad + 3 * (s + g); sp.w = bw - pad * 2; sp.h = sh;
    boardSprite();
  }
  function keyAt(x, y) {
    var e = board ? board.g * 0.45 : 0;
    for (var i = 0; i < keys.length; i += 1) {
      var k = keys[i];
      if (x >= k.x - e && x <= k.x + k.w + e && y >= k.y - e && y <= k.y + k.h + e) return i;
    }
    return -1;
  }
  function press(i) {
    var k = keys[i];
    k.n += 1;
    if (k.n !== 1) return;
    k.p = Math.max(k.p, 0.85); k.v = 0; k.glow = 1;
    Sfx.key(i, false); haptic(true);
    burst(k.x + k.w / 2, k.y + k.h * 0.45, [k.c, '#FFFFFF', k.top], 6, Math.min(k.w, k.h) * 2.4, Math.min(k.w, k.h) * 0.035);
    if (!k.lit) {
      k.lit = true; litN += 1;
      if (litN === keys.length && waveT < 0) { waveT = 0; Sfx.chime(); confetti(W, H, 60); toast(L.slogan); }
    }
  }
  function release(i) {
    var k = keys[i];
    if (k.n <= 0) return;
    k.n -= 1;
    if (k.n === 0) Sfx.key(i, true);
  }
  function legend(c, k, x, y, s) {
    c.fillStyle = k.leg; c.strokeStyle = k.leg; c.lineCap = 'round'; c.lineJoin = 'round';
    var i;
    if (k.lg === 'heart') {
      c.beginPath(); c.moveTo(x, y + s * 0.35);
      c.bezierCurveTo(x - s * 0.55, y - s * 0.05, x - s * 0.3, y - s * 0.5, x, y - s * 0.18);
      c.bezierCurveTo(x + s * 0.3, y - s * 0.5, x + s * 0.55, y - s * 0.05, x, y + s * 0.35);
      c.fill();
    } else if (k.lg === 'star') {
      c.beginPath();
      for (i = 0; i < 10; i += 1) {
        var a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? s * 0.18 : s * 0.42;
        if (i === 0) c.moveTo(x + Math.cos(a) * r, y + Math.sin(a) * r); else c.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
      }
      c.closePath(); c.fill();
    } else if (k.lg === 'dot') {
      c.beginPath(); c.arc(x, y, s * 0.16, 0, TAU); c.fill();
    } else if (k.lg === 'smile') {
      c.beginPath(); c.arc(x - s * 0.18, y - s * 0.1, s * 0.07, 0, TAU); c.arc(x + s * 0.18, y - s * 0.1, s * 0.07, 0, TAU); c.fill();
      c.lineWidth = s * 0.08; c.beginPath(); c.arc(x, y - s * 0.02, s * 0.24, 0.2 * Math.PI, 0.8 * Math.PI); c.stroke();
    } else if (k.lg === 'bar') {
      c.lineWidth = s * 0.09; c.beginPath(); c.moveTo(x - s * 0.5, y); c.lineTo(x + s * 0.5, y); c.stroke();
    }
  }
  function drawKey(c, k) {
    var x = k.x, y = k.y, w = k.w, h = k.h, mn = Math.min(w, h), r = mn * 0.16;
    var pp = clamp(k.p, -0.3, 1), pd = clamp(k.p, 0, 1), off = mn * 0.085 * pp, g;
    if (k.glow > 0.01) {
      g = c.createRadialGradient(x + w / 2, y + h / 2, 0, x + w / 2, y + h / 2, Math.max(w, h) * 0.85);
      g.addColorStop(0, rgba(k.c, (0.55 * k.glow).toFixed(3))); g.addColorStop(1, rgba(k.c, 0));
      c.fillStyle = g; c.fillRect(x - w * 0.45, y - h * 0.45, w * 1.9, h * 1.9);
    }
    c.fillStyle = 'rgba(0,0,0,' + (0.42 * (1 - 0.6 * pd)).toFixed(3) + ')';
    rrect(c, x + 1, y + mn * 0.07 * (1 - 0.7 * pd), w - 2, h, r); c.fill();
    g = c.createLinearGradient(0, y + off, 0, y + h);
    g.addColorStop(0, k.side); g.addColorStop(1, k.deep);
    c.fillStyle = g; rrect(c, x, y + off, w, h - off, r); c.fill();
    var ins = mn * 0.1, fx = x + ins, fy = y + off + ins * 0.45, fw = w - ins * 2, fh = h - off - ins * 2.45;
    g = c.createLinearGradient(0, fy, 0, fy + fh);
    g.addColorStop(0, k.top); g.addColorStop(1, k.c);
    c.fillStyle = g; rrect(c, fx, fy, fw, fh, r * 0.8); c.fill();
    g = c.createRadialGradient(fx + fw * 0.35, fy + fh * 0.3, 0, fx + fw * 0.35, fy + fh * 0.3, Math.max(fw, fh) * 0.7);
    g.addColorStop(0, 'rgba(255,255,255,0.38)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = g; rrect(c, fx, fy, fw, fh, r * 0.8); c.fill();
    c.globalAlpha = 0.6; legend(c, k, fx + fw / 2, fy + fh / 2, Math.min(fw, fh) * 0.6); c.globalAlpha = 1;
    if (k.lit) {
      var lx = fx + Math.min(fw, fh) * 0.16, ly = fy + Math.min(fw, fh) * 0.16, lr = mn * 0.035;
      g = c.createRadialGradient(lx, ly, 0, lx, ly, lr * 3.5);
      g.addColorStop(0, 'rgba(255,247,176,0.9)'); g.addColorStop(1, 'rgba(255,247,176,0)');
      c.fillStyle = g; c.beginPath(); c.arc(lx, ly, lr * 3.5, 0, TAU); c.fill();

  return {
    layout: layout,
    down: function (p) { var k = keyAt(p.x, p.y); ptr[p.id] = k; if (k >= 0) press(k); },
    move: function (p) {
      if (!(p.id in ptr)) return;
      var k = keyAt(p.x, p.y), o = ptr[p.id];
      if (k === o) return;
      if (o >= 0) release(o);
      if (k >= 0) press(k);
      ptr[p.id] = k;
    },
    up: function (p) { if (!(p.id in ptr)) return; var o = ptr[p.id]; delete ptr[p.id]; if (o >= 0) release(o); },
    update: function (dt) {
      for (var i = 0; i < keys.length; i += 1) {
        var k = keys[i];
        if (k.n > 0) { k.p += (1 - k.p) * Math.min(1, dt * 40); k.v = 0; }
        else { var acc = -k.p * 700 - k.v * 26; k.v += acc * dt; k.p += k.v * dt; if (Math.abs(k.p) < 0.002 && Math.abs(k.v) < 0.05) { k.p = 0; k.v = 0; } }
        k.glow *= Math.exp(-4 * dt);
      }
      if (waveT >= 0) {
        waveT += dt;
        for (var j = 0; j < keys.length; j += 1) {
          var q = keys[j], xn = (q.x + q.w / 2 - board.x) / board.w, ph = waveT * 1.8 - xn;
          if (ph > 0 && ph < 0.5) q.glow = Math.max(q.glow, Math.sin(ph / 0.5 * Math.PI));
        }
        if (waveT > 1.4) { waveT = -1; litN = 0; for (var z = 0; z < keys.length; z += 1) keys[z].lit = false; }
      }
    },
    draw: function (c) {
      var d = G.dpr;
      c.drawImage(boardSpr, board.x - 30, board.y - 30, boardSpr.width / d, boardSpr.height / d);
      for (var i = 0; i < keys.length; i += 1) drawKey(c, keys[i]);
    },
    hint: function () { var k = keys[4]; return { x: k.x + k.w / 2, y: k.y + k.h / 2 }; },
    debug: function () { var d = 0; for (var i = 0; i < keys.length; i += 1) if (keys[i].n > 0) d += 1; return { down: d, lit: litN, total: keys.length, wave: waveT >= 0 }; },
    destroy: function () { ptr = {}; boardSpr = null; }
  };
}

/* Harness */
var MAKERS = [BubbleWrap, Spinner, Keycaps];
var stage = $('stage'), play = $('play'), cv = $('cv'), ctx = cv.getContext('2d');
var cur = null, gi = 0, intro = 1, touched = false, rect = null, raf = 0, last = 0;

function measure() {
  var iw = window.innerWidth, ih = window.innerHeight;
  var sw = Math.min(iw, Math.round(ih * 9 / 16));
  stage.style.width = sw + 'px';
  document.documentElement.classList.toggle('wide', sw < iw - 1);
  var r = play.getBoundingClientRect();
  rect = r;
  var w = Math.max(1, Math.round(r.width)), h = Math.max(1, Math.round(r.height));
  var dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  if (w !== G.W || h !== G.H || dpr !== G.dpr) {
    G.W = w; G.H = h; G.dpr = dpr;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    cv.style.width = w + 'px'; cv.style.height = h + 'px';
    safeLayout();
  }
}
function safeLayout() {
  if (!cur) return;
  try { cur.layout(Math.max(G.W, 160), Math.max(G.H, 160)); } catch (e) { if (window.console) console.error(e); }
}

function setUI(animate) {
  $('gname').textContent = L.names[gi];
  $('gtip').textContent = L.tips[gi];
  var hint = $('hint');
  hint.classList.remove('swap');
  if (animate) { void hint.offsetWidth; hint.classList.add('swap'); }
  var dots = $('dots').children;
  for (var i = 0; i < dots.length; i += 1) dots[i].className = i === gi ? 'on' : '';
}

function startGame(i, animate) {
  if (cur && cur.destroy) cur.destroy();
  FX.length = 0;
  toastEl.classList.remove('show');
  gi = i;
  cur = MAKERS[i]();
  safeLayout();
  intro = animate ? 0 : 1; touched = false;
  setUI(animate);
}

function pt(e) { var r = rect || cv.getBoundingClientRect(); return { id: e.pointerId, x: e.clientX - r.left, y: e.clientY - r.top }; }
cv.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  rect = cv.getBoundingClientRect();
  unlockAudio();
  try { cv.setPointerCapture(e.pointerId); } catch (x) {}
  touched = true;
  if (cur) cur.down(pt(e));
});
cv.addEventListener('pointermove', function (e) { if (cur) cur.move(pt(e)); });
cv.addEventListener('pointerup', function (e) { unlockAudio(); if (cur) cur.up(pt(e)); });
cv.addEventListener('pointercancel', function (e) { if (cur) cur.up(pt(e)); });
cv.addEventListener('lostpointercapture', function (e) { if (cur) cur.up(pt(e)); });

$('next').addEventListener('click', function () {
  unlockAudio(); haptic(true);
  if (gi >= MAKERS.length - 1) { install(); return; }
  Sfx.ui();
  startGame(gi + 1, true);
  post('switch:' + (gi + 1));
});
$('get').addEventListener('click', function () { unlockAudio(); haptic(true); install(); });

function drawHint(h) {
  var t = (now() / 1000) % 1.6, k = t / 1.6, r = 10 + 30 * easeOutCubic(k), a = 1 - k;
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(70,15,30,' + (0.3 * a).toFixed(3) + ')';
  ctx.beginPath(); ctx.arc(h.x, h.y, r, 0, TAU); ctx.stroke();
  ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(255,255,255,' + (0.9 * a).toFixed(3) + ')';
  ctx.beginPath(); ctx.arc(h.x, h.y, r, 0, TAU); ctx.stroke();
  ctx.fillStyle = 'rgba(255,122,107,' + (0.45 + 0.15 * Math.sin(k * TAU)).toFixed(3) + ')';
  ctx.beginPath(); ctx.arc(h.x, h.y, 12, 0, TAU); ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.stroke();
}

function frame(t) {
  raf = 0;
  var dt = clamp((t - last) / 1000, 0, 0.05);
  last = t;
  try {
    if (cur) cur.update(dt);
    fxUpdate(dt);
    intro = Math.min(1, intro + dt / 0.32);
    ctx.setTransform(G.dpr, 0, 0, G.dpr, 0, 0);
    ctx.globalAlpha = 1;
    ctx.clearRect(0, 0, G.W, G.H);
    if (cur && G.W >= 40 && G.H >= 40) {
      ctx.save();
      if (intro < 1) {
        var e = easeOutCubic(intro), s = 0.94 + 0.06 * e;
        ctx.globalAlpha = e;
        ctx.translate(G.W / 2, G.H / 2); ctx.scale(s, s); ctx.translate(-G.W / 2, -G.H / 2);
      }
      cur.draw(ctx);
      ctx.restore();
      fxDraw(ctx);
      if (!touched && cur.hint) { var h = cur.hint(); if (h) drawHint(h); }
    }
  } catch (err) {
    if (window.console) console.error(err);
  }

}
function schedule() { if (!raf && !document.hidden) raf = requestAnimationFrame(frame); }

document.addEventListener('visibilitychange', function () {
  if (document.hidden) {
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    if (S.ac && S.ac.state === 'running') { S.wasOn = true; try { S.ac.suspend(); } catch (e) {} }
  } else {
    if (S.ac && S.wasOn) { S.wasOn = false; try { S.ac.resume(); } catch (e) {} }

    schedule();
  }

/* No scrolling, zoom or selection */
var stop = function (e) { if (e.cancelable) e.preventDefault(); };
document.addEventListener('touchmove', stop, { passive: false });
document.addEventListener('gesturestart', stop, { passive: false });
document.addEventListener('gesturechange', stop, { passive: false });
document.addEventListener('dblclick', stop);
document.addEventListener('contextmenu', stop);
document.addEventListener('selectstart', stop);
document.addEventListener('touchend', function () { unlockAudio(); }, { passive: true });

var icon = $('icon');
icon.addEventListener('error', function () { icon.style.visibility = 'hidden'; });

$('tag').textContent = L.tag;
$('nextL').textContent = L.next;
$('getL').textContent = L.get;

window.addEventListener('resize', measure);
window.addEventListener('orientationchange', measure);
if (window.ResizeObserver) { try { new ResizeObserver(measure).observe(play); } catch (e) {} }

if (Q.get('test') === '1') window.__pf = { game: function () { return gi + 1; }, state: function () { return cur && cur.debug ? cur.debug() : null; } };

measure();
var first = parseInt(Q.get('game'), 10);
startGame(first >= 1 && first <= 3 ? first - 1 : 0, false);
last = now();
schedule();
post('ready');
})();
