<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F6F7F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E110D" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>MyPartyGame</title>
<link rel="icon" href="/assets/mypartygame/icon.png">
<!-- MyPartyGame 플레이어블 광고(2026-10-11, My_Studio 세션). 한 파일(외부 스크립트 · 글꼴 · 네트워크 없음, 아이콘만 /assets/mypartygame/icon.png).
     게임 셋: 1 돌림판(커피 누가 살까?) · 2 폭탄 돌리기(이름 없이 폰을 넘기며 톡, 넘긴 횟수만 셈) · 3 2048(혼자서도).
     색은 앱과 같게: 바탕 #F6F7F4(다크 #0E110D, 기기 설정 따름) · 초록 #2FC85E, 게임마다 대표색 하나(돌림판 #FFB020 · 폭탄 #FF7A3D · 2048 #FFB020).
     '다른 게임' 규칙(사용자): 1번째 누름 → 게임 2, 2번째 → 게임 3, 3번째 → 설치. 앱 안에서는 XPromo 채널로 'ready' · 'switch:2' · 'switch:3' · 'install' 만 보낸다.
     오른쪽 위 64x64 는 앱이 닫기 단추를 그리는 자리라 비워 둔다. 쿼리: lang=ko|ja|en, from=광고를 띄운 앱, host=app, game=1|2|3(시험용). -->
<style>
:root {
  color-scheme: light dark;
  --bg: #F6F7F4; --outer: #E7EAE4; --surface: #FFFFFF; --ink: #12150F; --soft: #6B726A;
  --line: #D8DCD5; --hair: #EBEEEA; --green: #2FC85E; --green-ink: #1C9A46; --on-green: #06120A;
  --board: #D9E3D6; --slot: #E9EFE7; --veil: rgba(246,247,244,.86); --shadow: rgba(16,20,16,.10);
  --u: 4.3px;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
  --font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Hiragino Sans", "Noto Sans JP", Roboto, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0E110D; --outer: #060806; --surface: #191D18; --ink: #F1F3EE; --soft: #9BA49A;
    --line: #3A4137; --hair: #2C332B; --green-ink: #43D873;
    --board: #20261F; --slot: #2A3128; --veil: rgba(14,17,13,.84); --shadow: rgba(0,0,0,.35);
  }
}
:lang(ja) { --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", "Apple SD Gothic Neo", Roboto, sans-serif; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; height: 100%; overflow: hidden; background: var(--outer); overscroll-behavior: none;
  touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-text-size-adjust: 100%;
}
body { position: fixed; inset: 0; font-family: var(--font); color: var(--ink); }
button { font: inherit; color: inherit; cursor: pointer; touch-action: none; -webkit-user-select: none; user-select: none; }
#stage { position: absolute; top: 0; bottom: 0; left: 0; right: 0; margin: 0 auto; width: 100%; overflow: hidden; background: var(--bg); }
#stage.boxed { box-shadow: 0 0 0 1px var(--hair), 0 0 60px var(--shadow); }
.deco { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#shell { position: absolute; inset: 0; display: flex; flex-direction: column; }
#shell.shake { animation: shake .7s linear; }
@keyframes shake {
  0% { transform: none; } 7% { transform: translate(-14px, 9px); } 14% { transform: translate(13px, -11px); }
  22% { transform: translate(-11px, 8px); } 30% { transform: translate(10px, -7px); } 40% { transform: translate(-7px, 5px); }
  51% { transform: translate(5px, -4px); } 63% { transform: translate(-3px, 2px); } 78% { transform: translate(2px, -1px); } 100% { transform: none; }
}
/* bomb: white flash turning orange, then fading */
#flash { position: absolute; inset: 0; background: #FFFFFF; opacity: 0; pointer-events: none; }
#flash.on { animation: flash 1s linear; }
@keyframes flash {
  0% { opacity: 1; background: #FFFFFF; } 6% { opacity: 1; background: #FFFFFF; }
  30% { opacity: .95; background: #FF8A3D; } 100% { opacity: 0; background: #FF8A3D; }
}
#fx { position: absolute; left: 0; top: 0; pointer-events: none; }

/* header: the top-right 64x64 stays empty for the app's close button */
#hd { display: flex; align-items: center; gap: 10px; padding: calc(var(--sat) + 12px) 72px 4px calc(var(--sal) + 16px); min-height: calc(var(--sat) + 72px); }
#hd img { width: clamp(38px, calc(var(--u) * 10.6), 48px); height: clamp(38px, calc(var(--u) * 10.6), 48px); border-radius: 23%; flex: none; box-shadow: 0 4px 14px var(--shadow); background: #2FA060; }
.ht { min-width: 0; line-height: 1.22; }
.ht > div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kick { font-size: clamp(10.5px, calc(var(--u) * 2.6), 12px); font-weight: 800; color: var(--green-ink); letter-spacing: .02em; }
.nm { font-size: clamp(14px, calc(var(--u) * 4.3), 19px); font-weight: 900; }
.sb { font-size: clamp(11px, calc(var(--u) * 2.95), 13px); font-weight: 600; color: var(--soft); }

#gh { padding: 6px calc(var(--sar) + 16px) 0 calc(var(--sal) + 16px); }
.gt { display: flex; align-items: center; gap: 8px; min-width: 0; }
#gname { font-size: clamp(19px, calc(var(--u) * 5.6), 25px); font-weight: 900; white-space: nowrap; }
.chip { font-size: clamp(11px, calc(var(--u) * 2.9), 13px); font-weight: 800; padding: 4px 10px; border-radius: 999px; white-space: nowrap; color: var(--ink); border: 1px solid transparent; }
#ghint { margin-top: 3px; font-size: clamp(13px, calc(var(--u) * 3.6), 15.5px); font-weight: 600; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

#area { position: relative; flex: 1; min-height: 0; margin: 8px 0 4px; }

#bar { padding: 4px calc(var(--sar) + 16px) calc(var(--sab) + 14px) calc(var(--sal) + 16px); }
.dots { display: flex; justify-content: center; gap: 6px; margin-bottom: 10px; }
.dots i { width: 7px; height: 7px; border-radius: 99px; background: var(--line); transition: width .25s, background .25s; }
.dots i.on { width: 22px; background: var(--green); }
/* columns never shrink below their label ("Another game" needs ~155px at 320px wide) */
.btns { display: grid; grid-template-columns: minmax(max-content, 1fr) minmax(max-content, 1.2fr); gap: 10px; }
.btn { height: clamp(48px, calc(var(--u) * 13), 58px); padding: 0 12px; border-radius: 18px; border: 0; display: flex; align-items: center; justify-content: center; gap: 8px;
  font-weight: 800; font-size: clamp(15px, calc(var(--u) * 4.1), 18px); transition: transform .12s; position: relative; overflow: hidden; white-space: nowrap; }
.btn:active { transform: scale(.96); }
.btn svg { width: 1.15em; height: 1.15em; flex: none; }
#bOther { background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); }
#bInstall { background: var(--green); color: var(--on-green); box-shadow: 0 8px 22px rgba(47,200,94,.32), inset 0 1px 0 rgba(255,255,255,.3); }
#bInstall::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%;
  background: linear-gradient(100deg, rgba(255,255,255,0), rgba(255,255,255,.4), rgba(255,255,255,0)); animation: shine 3.4s ease-in-out 1.2s infinite; }
@keyframes shine { 0% { left: -60%; } 30%, 100% { left: 130%; } }

.g { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding: 0 calc(var(--sar) + 16px) 0 calc(var(--sal) + 16px); }
.g.enter { animation: enter .3s ease-out; }
@keyframes enter { from { opacity: 0; transform: translateX(22px); } to { opacity: 1; transform: none; } }
/* big round game button (start / spin / again) in the game's colour */
.act { flex: none; width: 100%; max-width: 380px; height: clamp(52px, calc(var(--u) * 14.2), 62px); border: 0; border-radius: 22px; display: flex; align-items: center; justify-content: center; gap: 8px;
  font-size: clamp(17px, calc(var(--u) * 4.7), 20px); font-weight: 800; white-space: nowrap; transition: transform .1s, opacity .2s; }
.act:active { transform: scale(.96); }
.act svg { width: 1.25em; height: 1.25em; flex: none; }

/* game 1: wheel */
.g1 { justify-content: center; }
.g1 .hl { position: relative; flex: none; width: 100%; height: clamp(50px, calc(var(--u) * 14.5), 64px); display: flex; align-items: center; justify-content: center; }
.g1 .q { font-size: clamp(19px, calc(var(--u) * 5.8), 26px); font-weight: 900; text-align: center; white-space: nowrap; transition: opacity .18s, transform .18s; }
.g1 .hl.won .q { opacity: 0; transform: scale(.9); }
.g1 .pill { position: absolute; left: 50%; top: 50%; max-width: 100%; display: flex; align-items: center; gap: 8px; padding: 9px 22px 9px 18px; border-radius: 999px; white-space: nowrap;
  font-size: clamp(22px, calc(var(--u) * 6.2), 28px); font-weight: 900; line-height: 1.15; opacity: 0; transform: translate(-50%, -50%) scale(.2); pointer-events: none; }
.g1 .pill svg { width: .95em; height: .95em; flex: none; }
.g1 .hl.won .pill { animation: pill .7s linear forwards; }
@keyframes pill {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(.2); } 18% { opacity: 1; transform: translate(-50%, -50%) scale(1.14); }
  36% { opacity: 1; transform: translate(-50%, -50%) scale(.95); } 55% { opacity: 1; transform: translate(-50%, -50%) scale(1.03); }
  75% { opacity: 1; transform: translate(-50%, -50%) scale(.99); } 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
}
.g1 .ww { position: relative; flex: none; width: 100%; height: 200px; margin-top: 6px; }
.g1 canvas { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
.g1 .act { margin: 12px 0 4px; background: #FFB020; color: #1B1F1A; box-shadow: 0 8px 20px rgba(255,176,32,.32), inset 0 1px 0 rgba(255,255,255,.35); }
.g1 .act.busy { opacity: .55; }

/* game 2: hot bomb (no names: pass the phone, tap the bomb, it counts passes) */
.g2 .top { flex: none; height: clamp(34px, calc(var(--u) * 9), 40px); display: flex; align-items: center; justify-content: center; }
.g2 .cnt { display: flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 999px; background: rgba(255,122,61,.16);
  font-size: clamp(14px, calc(var(--u) * 3.7), 16px); font-weight: 800; white-space: nowrap; opacity: 0; transition: opacity .2s; }
@media (prefers-color-scheme: dark) { .g2 .cnt { background: rgba(255,122,61,.24); } }
.g2 .cnt svg { width: 1.15em; height: 1.15em; flex: none; color: #FF7A3D; }
.g2.run .cnt { opacity: 1; }
.g2 .cnt.bump { animation: bump .26s cubic-bezier(.3,1.6,.5,1); }
@keyframes bump { from { transform: scale(1.2); } to { transform: none; } }
.g2 .bw { position: relative; flex: 1; width: 100%; min-height: 0; cursor: pointer; }
.g2 .bw canvas { position: absolute; left: 0; top: 0; }
.g2 .burst { position: absolute; left: 50%; top: 50%; width: 230px; height: 170px; pointer-events: none; opacity: 0; transform: translate(-50%, -50%) rotate(-7deg) scale(0); }
.g2 .burst svg { width: 100%; height: 100%; display: block; overflow: visible; }
.g2.boomed .burst { animation: burst .65s linear forwards; }
@keyframes burst {
  0% { opacity: 1; transform: translate(-50%, -50%) rotate(-7deg) scale(0); } 20% { opacity: 1; transform: translate(-50%, -50%) rotate(-7deg) scale(1.16); }
  38% { opacity: 1; transform: translate(-50%, -50%) rotate(-7deg) scale(.94); } 58% { opacity: 1; transform: translate(-50%, -50%) rotate(-7deg) scale(1.04); }
  78% { opacity: 1; transform: translate(-50%, -50%) rotate(-7deg) scale(.99); } 100% { opacity: 1; transform: translate(-50%, -50%) rotate(-7deg) scale(1); }
}
.g2 .msg { flex: none; width: 100%; height: clamp(70px, calc(var(--u) * 19), 84px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center; }
.g2 .ml { font-size: clamp(14px, calc(var(--u) * 3.6), 15.5px); font-weight: 600; color: var(--soft); line-height: 1.22; }
.g2.run .ml { font-size: clamp(16px, calc(var(--u) * 4.3), 18px); font-weight: 800; color: var(--ink); }
.g2.boomed .ml { font-size: clamp(19px, calc(var(--u) * 5.6), 24px); font-weight: 900; color: var(--ink); opacity: 0; }
.g2.stamped .ml { animation: stamp .24s cubic-bezier(.34,1.56,.64,1) forwards; }
@keyframes stamp { 0% { opacity: 0; transform: scale(1.7); } 40% { opacity: 1; } 100% { opacity: 1; transform: none; } }
.g2 .ms { font-size: clamp(13px, calc(var(--u) * 3.5), 15px); font-weight: 600; color: var(--soft); min-height: 1.2em; }
.g2 .act { margin: 4px 0 4px; background: #FF7A3D; color: #FFFFFF; text-shadow: 0 1px 1px rgba(122,28,12,.25); box-shadow: 0 8px 20px rgba(255,122,61,.32), inset 0 1px 0 rgba(255,255,255,.3); }
.g2.run .act { visibility: hidden; }
.g2.boomed .act { opacity: 0; pointer-events: none; }
.g2.armed .act { opacity: 1; pointer-events: auto; }

/* game 3: 2048 */
.g3 .top { width: var(--bd, 300px); display: flex; align-items: center; justify-content: space-between; margin-top: 2px; }
.g3 .sc { display: flex; align-items: baseline; gap: 8px; padding: 6px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--hair); }
.g3 .sl { font-size: 12.5px; font-weight: 700; color: var(--soft); }
.g3 .sv { font-size: 20px; font-weight: 900; min-width: 1.5em; }
.g3 .rs { width: 42px; height: 42px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: flex; align-items: center; justify-content: center; padding: 0; }
.g3 .rs svg { width: 20px; height: 20px; }
.g3 .rs:active { transform: scale(.94); }
.g3 .bw { flex: 1; width: 100%; min-height: 0; display: flex; align-items: center; justify-content: center; }
.g3 .board { position: relative; width: var(--bd, 300px); height: var(--bd, 300px); border-radius: calc(var(--bd, 300px) * .05); background: var(--board); flex: none; }
.g3 .cell { position: absolute; border-radius: 12px; background: var(--slot); }
.g3 .tile { position: absolute; left: 0; top: 0; transition: transform .11s ease-out; will-change: transform; }
.g3 .tiles.nt .tile { transition: none; }
.g3 .tf { width: 100%; height: 100%; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 900; box-shadow: 0 2px 0 rgba(0,0,0,.1); }
.g3 .tf.in { animation: tin .16s ease-out both; }
.g3 .tf.mg { animation: tmg .2s ease-out; }
@keyframes tin { from { transform: scale(0); } to { transform: scale(1); } }
@keyframes tmg { 0% { transform: scale(1); } 45% { transform: scale(1.17); } 100% { transform: scale(1); } }
.g3 .over { position: absolute; inset: 0; border-radius: calc(var(--bd, 300px) * .05); background: var(--veil); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
.g3 .board.dead .over { display: flex; animation: enter .3s ease-out; }
.g3 .ot { font-size: 20px; font-weight: 900; text-align: center; padding: 0 12px; }
.g3 .ob { height: 48px; padding: 0 28px; border: 0; border-radius: 16px; font-weight: 900; font-size: 17px; color: #1B1F1A; background: #FFB020; }
</style>
</head>
<body>
<div id="stage">
  <svg class="deco" viewBox="0 0 360 640" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <g opacity=".42">
      <rect x="14" y="98" width="15" height="5" rx="2.5" fill="#3E9BFF" transform="rotate(-25 21 100)"/>
      <circle cx="40" cy="150" r="4" fill="#FF5C7A"/>
      <rect x="330" y="176" width="13" height="5" rx="2.5" fill="#FFB020" transform="rotate(35 336 178)"/>
      <circle cx="316" cy="128" r="3.5" fill="#A368FF"/>
      <rect x="8" y="372" width="13" height="5" rx="2.5" fill="#00C2C7" transform="rotate(60 14 374)"/>
      <circle cx="344" cy="420" r="4" fill="#FFB020"/>
      <rect x="20" y="560" width="14" height="5" rx="2.5" fill="#FF7A3D" transform="rotate(20 27 562)"/>
      <circle cx="334" cy="596" r="3.5" fill="#FF5C7A"/>
      <rect x="306" y="520" width="12" height="5" rx="2.5" fill="#3E9BFF" transform="rotate(-40 312 522)"/>
      <circle cx="22" cy="470" r="3" fill="#2FC85E"/>
      <rect x="338" y="300" width="12" height="5" rx="2.5" fill="#A368FF" transform="rotate(70 344 302)"/>
      <circle cx="20" cy="250" r="3" fill="#2FC85E"/>
    </g>
  </svg>
  <div id="shell">
    <header id="hd">
      <img src="/assets/mypartygame/icon.png" alt="" width="48" height="48" draggable="false">
      <div class="ht"><div class="kick">MyPartyGame</div><div class="nm" id="nm"></div><div class="sb" id="sb"></div></div>
    </header>
    <section id="gh">
      <div class="gt"><span id="gname"></span><span class="chip" id="gchip"></span></div>
      <div id="ghint"></div>
    </section>
    <main id="area"></main>
    <nav id="bar">
      <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="btns">
        <button class="btn" id="bOther" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg><span id="tOther"></span></button>
        <button class="btn" id="bInstall" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="M7 10.5 12 15.5 17 10.5"/><path d="M5 20h14"/></svg><span id="tInstall"></span></button>
      </div>
    </nav>
  </div>
  <div id="flash"></div>
  <canvas id="fx"></canvas>
</div>
<script>
(function () {
  'use strict';

  /* ---------- store links ---------- */
  var IOS_URL = 'https://apps.apple.com/app/id6821380529?pt=129467809&ct=xp_play_party&mt=8';
  var AND_URL = 'https://play.google.com/store/apps/details?id=com.ymc.mypartygame&referrer=utm_source%3Dxpromo%26utm_medium%3Dplayable%26utm_campaign%3Dxp_play_party';
  var HOME_URL = 'https://mystudioapps.com/mypartygame/';

  /* ---------- language ---------- */
  var Q = new URLSearchParams(location.search);
  var LANGS = ['ko', 'ja', 'en'];
  function pickLang() {
    var q = String(Q.get('lang') || '').toLowerCase();
    if (LANGS.indexOf(q) >= 0) return q;
    var list = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en'];
    for (var i = 0; i < list.length; i++) {
      var n = String(list[i] || '').slice(0, 2).toLowerCase();
      if (LANGS.indexOf(n) >= 0) return n;
    }
    return 'en';
  }
  var lang = pickLang();
  document.documentElement.lang = lang;
  if (Q.get('host') === 'app') document.documentElement.setAttribute('data-host', 'app');

  var T = {
    ko: {
      name: '우리들의 파티게임', sub: '모여서, 내기할 때, 혼자서도', other: '다른 게임', install: '설치',
      games: [
        { name: '돌림판', chip: '내기할 때 · 2인 이상', hint: '돌리기를 눌러 한 명을 뽑아요' },
        { name: '폭탄 돌리기', chip: '내기할 때 · 2인 이상', hint: '언제 터질지 몰라요, 얼른 넘겨요!' },
        { name: '2048', chip: '혼자서도 · 1인용', hint: '밀어서 같은 숫자를 합쳐요' }
      ],
      names: ['민지', '서윤', '하린', '도윤', '지호', '준서'],
      wq: '커피 누가 살까? ☕', spin: '돌리기', wres: '{n}!',
      bIdle: '시작하면 폰을 옆 사람에게 계속 넘겨요', bRun: '넘길 때 폭탄을 톡!', bCount: '넘긴 횟수 {n}',
      bBoom: '펑!', bHolder: '들고 있는 사람이 벌칙!', bPassed: '{n}번 넘겼어요', bStart: '시작', bAgain: '다시 하기',
      again: '다시', score: '점수', over: '더 움직일 수 없어요', win: '2048 달성!'
    },
    ja: {
      name: 'みんなのパーティーゲーム', sub: '集まって、賭けて、ひとりでも', other: '別のゲーム', install: 'インストール',

    for (var i = 0; i < 16; i++) { var ce = mk('div', 'cell'); cellsEl.appendChild(ce); cellEls.push(ce); }
    var grid, score = 0, busy = false, seq = 0, removed = [], merged = [], gained = 0, side = 0, cell = 0, gap = 0, dead = false, won = false;

    function pos(r, c) { return [gap + c * (cell + gap), gap + r * (cell + gap)]; }
    function place(tile) { var p = pos(tile.r, tile.c); tile.el.style.transform = 'translate(' + p[0].toFixed(1) + 'px,' + p[1].toFixed(1) + 'px)'; }
    function paint(tile) {
      var v = tile.v, col = TILE[v] || ['#C98F1A', '#2E1E00'], f = tile.f;
      f.textContent = v; f.style.background = col[0]; f.style.color = col[1];
      f.style.fontSize = Math.round(cell * (v < 100 ? 0.44 : v < 1000 ? 0.36 : 0.29)) + 'px';
      f.style.borderRadius = Math.round(cell * 0.16) + 'px';
      f.style.boxShadow = v >= 2048 ? '0 0 18px rgba(255,176,32,.7), 0 2px 0 rgba(0,0,0,.1)' : '';
    }
    function sizeTile(tile) { tile.el.style.width = tile.el.style.height = cell + 'px'; }
    function addTile(r, c, v, cls) {
      var e = mk('div', 'tile', '<div class="tf"></div>');
      var tile = { r: r, c: c, v: v, el: e, f: e.firstChild };
      sizeTile(tile); place(tile); paint(tile);
      if (cls) tile.f.classList.add(cls);
      tilesEl.appendChild(e); grid[r][c] = tile;
      return tile;
    }
    function empties() {
      var out = [];
      for (var r = 0; r < 4; r++) for (var c = 0; c < 4; c++) if (!grid[r][c]) out.push([r, c]);
      return out;
    }
    function spawn() {
      var e = empties(); if (!e.length) return;
      var p = e[rnd(e.length)];
      addTile(p[0], p[1], Math.random() < 0.9 ? 2 : 4, 'in');
    }
    function canMove() {
      for (var r = 0; r < 4; r++) for (var c = 0; c < 4; c++) {
        var a = grid[r][c]; if (!a) return true;
        if (c < 3 && grid[r][c + 1] && grid[r][c + 1].v === a.v) return true;
        if (r < 3 && grid[r + 1][c] && grid[r + 1][c].v === a.v) return true;
      }
      return false;
    }
    function newGame() {
      busy = false; seq++; removed = []; merged = []; dead = false; won = false; score = 0; scoreEl.textContent = '0';
      board.classList.remove('dead'); tilesEl.innerHTML = '';
      grid = [[null, null, null, null], [null, null, null, null], [null, null, null, null], [null, null, null, null]];
      // two matching tiles in one line so the very first swipe merges, plus one more
      var line = rnd(4), horiz = Math.random() < 0.5, a = rnd(4), b = (a + 1 + rnd(3)) % 4;
      if (horiz) { addTile(line, a, 2, 'in'); addTile(line, b, 2, 'in'); } else { addTile(a, line, 2, 'in'); addTile(b, line, 2, 'in'); }
      var e = empties(), p = e[rnd(e.length)]; addTile(p[0], p[1], 4, 'in');
    }
    function lineCells(dir, i) {
      var out = [];
      for (var k = 0; k < 4; k++) {
        if (dir === 'L') out.push([i, k]); else if (dir === 'R') out.push([i, 3 - k]);
        else if (dir === 'U') out.push([k, i]); else out.push([3 - k, i]);
      }
      return out;
    }
    function move(dir) {
      if (dead) return;
      if (busy) finish(seq);
      var next = [[null, null, null, null], [null, null, null, null], [null, null, null, null], [null, null, null, null]];
      var moved = false; removed = []; merged = []; gained = 0;
      for (var i = 0; i < 4; i++) {
        var cells = lineCells(dir, i), slot = 0, last = null;
        for (var k = 0; k < 4; k++) {
          var tile = grid[cells[k][0]][cells[k][1]];
          if (!tile) continue;
          if (last && last.v === tile.v) {
            var at = cells[slot - 1];
            tile.r = at[0]; tile.c = at[1];
            last.v *= 2; gained += last.v;
            removed.push(tile); merged.push(last); last = null; moved = true;
          } else {
            var to = cells[slot];
            if (tile.r !== to[0] || tile.c !== to[1]) moved = true;
            tile.r = to[0]; tile.c = to[1];
            next[to[0]][to[1]] = tile; last = tile; slot++;
          }
        }
      }
      if (!moved) { S.bump(); return; }
      grid = next;
      for (var r = 0; r < 4; r++) for (var c = 0; c < 4; c++) if (grid[r][c]) place(grid[r][c]);
      removed.forEach(place);
      busy = true; S.swipe(); buzz();
      var my = ++seq;
      ctx.later(function () { finish(my); }, 120);
    }
    function finish(my) {
      if (!busy || my !== seq) return;
      busy = false;
      removed.forEach(function (tl) { if (tl.el.parentNode) tl.el.parentNode.removeChild(tl.el); });
      var top = 0;
      merged.forEach(function (tl) {
        paint(tl); tl.f.classList.remove('in', 'mg'); void tl.f.offsetWidth; tl.f.classList.add('mg');
        if (tl.v > top) top = tl.v;
      });
      if (top) S.merge(top);
      removed = []; merged = [];
      if (gained) { score += gained; scoreEl.textContent = String(score); }
      spawn();
      if (top >= 2048 && !won) {
        won = true; var p = centerOf(board);
        fx.burst(p.x, p.y, 100, PALETTE, { speed: 720 }); S.win();
        overText.textContent = t.win;
      }
      if (!canMove()) {
        dead = true; overText.textContent = t.over;
        ctx.later(function () { board.classList.add('dead'); }, 250);
      }
    }
    function resize() {
      var s = Math.floor(Math.min(bwEl.clientWidth, bwEl.clientHeight - 6, 440));
      side = Math.max(160, s); gap = side * 0.028; cell = (side - gap * 5) / 4;
      root.style.setProperty('--bd', side + 'px');
      for (var i = 0; i < 16; i++) {
        var p = pos(Math.floor(i / 4), i % 4), ce = cellEls[i];
        ce.style.width = ce.style.height = cell + 'px'; ce.style.left = p[0] + 'px'; ce.style.top = p[1] + 'px';
        ce.style.borderRadius = Math.round(cell * 0.16) + 'px';
      }
      tilesEl.classList.add('nt');
      for (var r = 0; r < 4; r++) for (var c = 0; c < 4; c++) { var tl = grid[r][c]; if (tl) { sizeTile(tl); place(tl); paint(tl); } }
      void tilesEl.offsetWidth; tilesEl.classList.remove('nt');
    }

    // swipe anywhere in the game area; arrow keys too
    var sx = 0, sy = 0, pid = null, fired = false;
    ctx.on(root, 'pointerdown', function (e) {
      if (e.target.closest && e.target.closest('button')) return;
      pid = e.pointerId; sx = e.clientX; sy = e.clientY; fired = false;
      try { root.setPointerCapture(pid); } catch (er) {}
    });
    function swipeCheck(e, end) {
      if (pid === null || e.pointerId !== pid || fired) return;
      var dx = e.clientX - sx, dy = e.clientY - sy, ax = Math.abs(dx), ay = Math.abs(dy);
      if (Math.max(ax, ay) < (end ? 18 : 30)) return;
      fired = true;
      move(ax > ay ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U'));
    }
    ctx.on(root, 'pointermove', function (e) { swipeCheck(e, false); });
    ctx.on(root, 'pointerup', function (e) { swipeCheck(e, true); pid = null; });
    ctx.on(root, 'pointercancel', function () { pid = null; });
    ctx.on(window, 'keydown', function (e) {
      var m = { ArrowLeft: 'L', ArrowRight: 'R', ArrowUp: 'U', ArrowDown: 'D', a: 'L', d: 'R', w: 'U', s: 'D' }[e.key];
      if (m) { e.preventDefault(); move(m); }
    });
    function restart() { S.click(); buzz(); newGame(); }
    ctx.on(root.querySelector('.rs'), 'click', restart);
    ctx.on(root.querySelector('.ob'), 'click', restart);

    grid = [[null, null, null, null], [null, null, null, null], [null, null, null, null], [null, null, null, null]];
    resize(); newGame();

    return {
      resize: resize,
      destroy: function () { seq++; ctx.dispose(); }
    };
  }

  /* ---------- shell ---------- */
  var GAMES = [Wheel, Bomb, G2048];
  var gi = 1, ctxNow = null;
  var qg = parseInt(Q.get('game'), 10);
  if (qg >= 1 && qg <= 3) gi = qg;
  var dots = document.querySelectorAll('.dots i'), chip = $('gchip');

  $('nm').textContent = t.name;
  $('sb').textContent = t.sub;
  $('tOther').textContent = t.other;
  $('tInstall').textContent = t.install;

  function paintChip() {
    var acc = ACCENTS[gi - 1];
    chip.style.background = rgba(acc, DARK ? 0.24 : 0.16);
    chip.style.borderColor = rgba(acc, DARK ? 0.5 : 0.45);
  }

  function show(n) {
    if (active) { active.destroy(); active = null; }
    if (ctxNow) ctxNow.dispose();
    area.innerHTML = '';
    fx.clear();
    gi = n;
    var info = t.games[n - 1];
    $('gname').textContent = info.name; chip.textContent = info.chip; $('ghint').textContent = info.hint;
    paintChip();
    for (var i = 0; i < dots.length; i++) dots[i].classList.toggle('on', i === n - 1);
    ctxNow = makeCtx();
    active = GAMES[n - 1](ctxNow);
    if (area.firstChild) area.firstChild.classList.add('enter');
    wake();
  }

  function layout() {
    var vw = window.innerWidth, vh = window.innerHeight;
    var w = vw / vh > 0.62 ? Math.round(vh * 9 / 16) : vw;
    stage.style.width = w + 'px';
    stage.classList.toggle('boxed', w < vw);
    document.documentElement.style.setProperty('--u', (w / 100).toFixed(3) + 'px');
    fx.resize();
    if (active && active.resize) active.resize();
  }
  var resizeTimer = 0;
  window.addEventListener('resize', function () {
    if (resizeTimer) return;
    resizeTimer = setTimeout(function () { resizeTimer = 0; layout(); wake(); }, 60);
  });
  // light / dark follows the device
  if (mq) {
    var onScheme = function () { DARK = mq.matches; paintChip(); if (active && active.redraw) active.redraw(); };
    if (mq.addEventListener) mq.addEventListener('change', onScheme); else if (mq.addListener) mq.addListener(onScheme);
  }

  $('bOther').addEventListener('click', function () {
    S.click(); buzz();
    if (gi < 3) { show(gi + 1); post('switch:' + gi); }
    else install();
  });
  $('bInstall').addEventListener('click', function () { buzz(); install(); });

  // first tap unlocks audio; no scrolling, pinch zoom, double-tap zoom or long-press menu
  document.addEventListener('pointerdown', S.unlock, true);
  document.addEventListener('touchend', S.unlock, true);
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (ev) { document.addEventListener(ev, function (e) { e.preventDefault(); }, { passive: false }); });
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  layout();
  show(gi);
  post('ready');
})();
</script>
</body>
