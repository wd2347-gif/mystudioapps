<!-- MyPartyGame playable ad (shell, 2026-10-11, My_Studio session). Built by playable/_src/build.py: do not edit playable/mypartygame/index.html by hand.

     Each load picks one set of 3 games at random (never the same set twice in a row), ?set=N forces one, ?game=K starts at position K.

      area.appendChild(el);
      ctxNow = makeCtx(id, def, n, el);
      frameBroken = false;
      try {
        active = def.make(ctxNow) || {};
        if (active.resize) active.resize();
        ctxNow._hint.place();
        el.classList.add('enter');
        wake();
        return true;
      } catch (e) {
        if (window.console) console.error('game ' + id + ' failed to start', e);
        teardown();
      }
    }
    return false;
  }

  function layout() {
    var vw = window.innerWidth, vh = window.innerHeight;
    var w = vw / vh > 0.62 ? Math.round(vh * 9 / 16) : vw;
    stage.style.width = w + 'px';
    stage.classList.toggle('boxed', w < vw);
    document.documentElement.style.setProperty('--u', (w / 100).toFixed(3) + 'px');
    if (ids && ids.length) fitTitle();
    fx.resize();
    if (active && active.resize) { try { active.resize(); } catch (e) { if (window.console) console.error(e); } }
    if (ctxNow) ctxNow._hint.place();
  }
  var resizeTimer = 0;
  window.addEventListener('resize', function () {
    if (resizeTimer) return;
    resizeTimer = setTimeout(function () { resizeTimer = 0; layout(); wake(); }, 60);
  });
  // light / dark follows the device
  if (mq) {
    var onScheme = function () {
      DARK = mq.matches; paintChip();
      if (ctxNow) { var acc = ctxNow.accent; ctxNow.el.style.setProperty('--acc-soft', rgba(acc, DARK ? 0.24 : 0.16)); }
      if (active && active.redraw) { try { active.redraw(); } catch (e) {} }
      wake();
    };
    if (mq.addEventListener) mq.addEventListener('change', onScheme); else if (mq.addListener) mq.addListener(onScheme);
  }

  var lastOther = 0;
  $('bOther').addEventListener('click', function () {
    var now = Date.now();
    if (now - lastOther < 350) return;
    lastOther = now;
    S.click(); buzz();
    if (pos < ids.length) { if (show(pos + 1)) post('switch:' + pos); else install(); }
    else install();
  });
  $('bInstall').addEventListener('click', function () { buzz(); install(); });

  // first tap unlocks audio; no scrolling, pinch zoom, double-tap zoom or long-press menu
  document.addEventListener('pointerdown', S.unlock, true);
  document.addEventListener('touchend', S.unlock, true);
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (ev) { document.addEventListener(ev, function (e) { e.preventDefault(); }, { passive: false }); });
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  if (TEST) {
    window.__pf = {
      set: function () { return setIdx + 1; },
      ids: function () { return ids.slice(); },
      game: function () { return pos; },
      state: function () { try { return active && active.debug ? active.debug() : null; } catch (e) { return null; } }
    };
  }

  layout();
  if (ids.length && show(pos)) post('ready');
})();
</script>
</body>
</html>
