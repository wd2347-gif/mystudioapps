<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="dark">
<title>Ultimate Duck</title>
<link rel="icon" type="image/png" href="icon.png">
<script>
/* 그리는 해상도 상한(11/13 가볍게): 화면 점 비율을 1.5 까지만 알려 준다. 플루터는 이 값으로 캔버스 크기를 정한다.
   넓은 창(태블릿 · 컴퓨터)은 그리는 점이 150만 개를 넘지 않게 더 낮춘다(1 아래로는 안 내린다): 휴대폰은 그대로 1.5. */
(function () {
  var MAX = 1.5, PX = 1.5e6;
  try {
    var d = Object.getOwnPropertyDescriptor(window, 'devicePixelRatio') ||
            Object.getOwnPropertyDescriptor(Window.prototype, 'devicePixelRatio');
    var get = d && d.get;
    var real = function () { try { return get ? get.call(window) : 1; } catch (e) { return 1; } };
    Object.defineProperty(window, 'devicePixelRatio', {
      configurable: true,
      get: function () {
        var m = MAX, w = window.innerWidth || 0, h = window.innerHeight || 0;
        if (w > 0 && h > 0) m = Math.min(MAX, Math.max(1, Math.sqrt(PX / (w * h))));
        return Math.min(m, real() || 1);
      }
    });
  } catch (e) {}
})();

/* 화면 새로 고침 수 재기(발열): 플루터 웹은 화면이 늘 1초 60장이라고 알려 줘서, 120장 화면(안드로이드 WebView)에서는
   매 장을 다 굽는다. 불러오는 동안 장 사이 간격을 재 두고 게임이 window.__duckHz 로 읽어 60장으로 쉬어 간다.
   불러오느라 밀린 장은 간격이 두세 배로 나오므로 짧은 쪽(아래 10%)에 모인 값만 쓴다. 못 쟀으면 0(화면 값 그대로).
   게임은 켜질 때 한 번, 놀이 1초 뒤에 한 번 더 읽는다(가까운 120장만 본다). 900장 뒤에는 재기를 그친다. */
(function () {
  var ds = [], last = 0, n = 0;
  function f(t) {
    if (last) { var d = t - last; if (d > 5 && d < 70) { ds.push(d); if (ds.length > 120) ds.shift(); } }
    last = t;
    if (++n < 900) requestAnimationFrame(f);
  }
  try {
    requestAnimationFrame(f);
    Object.defineProperty(window, '__duckHz', {
      configurable: true,
      get: function () {
        if (ds.length < 8) return 0;
        var s = ds.slice().sort(function (a, b) { return a - b; });
        var m = s[Math.floor(s.length * .1)], sum = 0, k = 0;
        for (var i = 0; i < s.length; i++) if (Math.abs(s[i] - m) <= m * .15) { sum += s[i]; k++; }
        return k ? 1000 / (sum / k) : 0;
      }
    });
  } catch (e) {}
})();

/* 미리 받기: 로더(flutter_bootstrap.js)가 돌기 전에 큰 것부터 같이 받기 시작한다(왕복 한 번 · 차례 기다림을 줄인다).
   CanvasKit 은 로더와 같은 규칙으로 고른다(크롬 계열 = 크롬판, 나머지 = 전체판). 글꼴 · 그림 표는 엔진이 fetch 로 받는다. */
(function () {
  function pre(href, as, cors) {
    var l = document.createElement('link');
    l.rel = 'preload'; l.href = href; l.as = as;
    if (cors) l.crossOrigin = 'anonymous';
    document.head.appendChild(l);
  }
  var blink = navigator.vendor === 'Google Inc.' || (navigator.userAgent || '').indexOf('Edg/') >= 0;
  var chromium = blink && typeof Intl.v8BreakIterator !== 'undefined' && typeof Intl.Segmenter !== 'undefined' &&
                 typeof ImageDecoder !== 'undefined';
  var ck = chromium ? 'canvaskit/chromium/' : 'canvaskit/';
  pre('main.dart.js', 'script');
  pre(ck + 'canvaskit.wasm', 'fetch', true);
  ['assets/assets/fonts/IBMPlexSansKR-400.ttf', 'assets/assets/fonts/IBMPlexSansKR-600.ttf',
   'assets/assets/fonts/IBMPlexSansKR-700.ttf', 'assets/assets/fonts/BlackHanSans-400.ttf',
   'assets/fonts/fallback/Roboto-Regular.ttf', 'assets/assets/art/meta.json',
   // 엔진이 켜진 뒤에야 차례로 받던 것(글꼴 표 → 아이콘 글꼴): 왕복 두 번을 미리 끝낸다
   'assets/FontManifest.json', 'assets/fonts/MaterialIcons-Regular.otf'].forEach(function (f) { pre(f, 'fetch', true); });
  window.__duckPre = pre;
})();
</script>
<style>
  html, body { margin: 0; height: 100%; background: #11121D; overflow: hidden; }
  #ld { position: fixed; inset: 0; z-index: 99; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: radial-gradient(circle at 50% 45%, #1B1D33, #0A0B12 70%); transition: opacity .35s ease; }
  #ld img { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 6px 24px rgba(0,0,0,.6);
            animation: ldp 1.1s ease-in-out infinite; }
  #ld.off { opacity: 0; pointer-events: none; }
  #bar { width: 168px; height: 8px; margin-top: 28px; border-radius: 4px; background: rgba(255,255,255,.12); overflow: hidden; }
  #bar i { display: block; height: 100%; width: 0; border-radius: 4px;
           background: linear-gradient(90deg, #FFD978, #F0A928); transition: width .25s ease-out; }
  @keyframes ldp { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
</style>
</head>
<body>
<div id="ld"><img alt="" src="icon.png"><div id="bar"><i></i></div></div>
<script>
/* 최강의 오리 체험판 ↔ 앱(자체 전면 WebView, JS 채널 XPromo): 'ready' · 'install' 만 보낸다.
   채널이 없는 브라우저면 설치 단추가 스토어로 간다(기기는 userAgent 로 가른다). 게임 쪽은 duckXP(말) 만 부른다. */
(function () {
  var IOS_URL = 'https://apps.apple.com/app/id6823883556?ct=xp_play_duck';
  var AND_URL = 'https://play.google.com/store/apps/details?id=com.ymc.weaponpop&referrer=utm_campaign%3Dxp_play_duck';
  var LANGS = ['ko', 'en', 'ja', 'zh', 'es', 'fr', 'de', 'pt', 'ar'];
  var APP = ['최강의 오리', 'Ultimate Duck', '最強アヒル伝説', '最強鴨鴨', 'Pato Supremo', 'Super Canard', 'Superente', 'Patão Supremo', 'البطة الخارقة'];
  function pick() {
    var q = null;
    try { q = new URLSearchParams(location.search).get('lang'); } catch (e) {}
    var l = [q].concat(navigator.languages || [navigator.language || '']);
    for (var i = 0; i < l.length; i++) {
      if (!l[i]) continue;
      var c = String(l[i]).toLowerCase().split(/[-_]/)[0];
      if (LANGS.indexOf(c) >= 0) return c;
      if (i === 0 && q) continue;
      return 'en';
    }
    return 'ko';
  }
  var lang = pick();
  // 번역 표(한국어는 없다)도 미리 받는다
  if (lang !== 'ko' && window.__duckPre) window.__duckPre('assets/assets/l10n/' + lang + '.json', 'fetch', true);
  document.documentElement.lang = lang;
  document.title = APP[LANGS.indexOf(lang)];

  function hasXP() { return !!(window.XPromo && typeof window.XPromo.postMessage === 'function'); }
  function post(m) { if (!hasXP()) return; try { window.XPromo.postMessage(m); } catch (e) {} }
  var lastInstall = 0;
  function install() {
    var now = Date.now();
    if (now - lastInstall < 1200) return;
    lastInstall = now;
    if (hasXP()) { post('install'); return; }
    var ua = navigator.userAgent || '';
    var android = /Android/i.test(ua);
    var url = android ? AND_URL : IOS_URL;
    var framed = false;
    try { framed = window.top !== window.self; } catch (e) { framed = true; }
    if (framed) {
      var w = null;
      try { w = window.open(url, '_blank'); } catch (e) {}
      if (w) { try { w.opener = null; } catch (e) {} return; }
    }
    location.href = url;
  }
  // 불러오기 막대: 받은 양(같은 출처 자원의 풀린 크기) ÷ 이 기기가 받을 양(빌드가 적는다) + 시간에 따라 조금씩.
  // 'ready' 때 끝까지 채우고 걷는다.
  var SIZES = /*PL_SIZES*/{"jsChromium": 10819166, "jsFull": 12675723}/*PL_SIZES*/;
  var blink = navigator.vendor === 'Google Inc.' || (navigator.userAgent || '').indexOf('Edg/') >= 0;
  var expect = blink && Intl.v8BreakIterator && typeof ImageDecoder !== 'undefined' ? SIZES.jsChromium : SIZES.jsFull;
  var got = 0, t0 = Date.now(), shown = 0, bar = null;
  function count(es) {
    for (var i = 0; i < es.length; i++) got += es[i].decodedBodySize || es[i].encodedBodySize || 0;
  }
  try {
    count(performance.getEntriesByType('resource'));
    new PerformanceObserver(function (l) { count(l.getEntries()); }).observe({ type: 'resource', buffered: false });
  } catch (e) {}
  function step() {
    if (!bar) bar = document.querySelector('#bar i');
    if (!bar) return;
    var s = (Date.now() - t0) / 1000;
    var p = Math.max(got / expect * .95, 1 - Math.exp(-s / 3.2));
    shown = Math.max(shown, Math.min(.96, p));
    bar.style.width = (shown * 100).toFixed(1) + '%';
  }
  var tm = setInterval(step, 120);
  var ready = false;
  addEventListener('flutter-first-frame', function () { window.__duckFirstFrame = performance.now(); });
  window.duckXP = function (m) {
    if (m === 'ready') {
      if (ready) return;
      ready = true;
      window.__duckReadyAt = performance.now();
      clearInterval(tm);
      if (bar) bar.style.width = '100%';
      var ld = document.getElementById('ld');
      if (ld) { setTimeout(function () { ld.className = 'off'; }, 150); setTimeout(function () { ld.remove(); }, 550); }
      post('ready');
    } else if (m === 'install') {
      install();
    } else if (m.indexOf('mark:') === 0) {
      (window.__duckMarks = window.__duckMarks || {})[m.slice(5)] = Math.round(performance.now());
    }
  };
})();
</script>
<script src="flutter_bootstrap.js" async></script>
