  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.title = t.name + ': MyStudio';
  for (const k of ['name', 'sub', 'tagline', 'desc', 'soon', 'devices']) document.getElementById(k).textContent = t[k];
  document.querySelector('.icon').alt = t.name;
  document.getElementById('shots').innerHTML = SHOTS.map((s, i) =>
    `<figure><img src="/assets/weaponpop/${s}.jpg" alt="${esc(t.shots[i])}" width="460" height="937" loading="lazy"><figcaption>${esc(t.shots[i])}</figcaption></figure>`).join('');
  document.getElementById('features').innerHTML = t.features.map(([e, h, p]) =>
    `<div class="feature"><div class="emoji">${e}</div><h3>${esc(h)}</h3><p>${esc(p)}</p></div>`).join('');
  const terms = document.getElementById('f-terms'), privacy = document.getElementById('f-privacy');
  terms.textContent = t.terms; terms.href = `terms.html?lang=${lang}`;
  privacy.textContent = t.privacy; privacy.href = `privacy.html?lang=${lang}`;
  document.getElementById('f-support').textContent = t.support;
  document.getElementById('lang').value = lang;
}
document.getElementById('lang').addEventListener('change', e => {
  try { localStorage.setItem('lang', e.target.value); } catch (err) {}
  show(e.target.value);
});
show(pick());
</script>
</body>
</html>
