<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyStudio</title>
<meta name="robots" content="noindex">
<meta property="og:title" content="MyStudio">
<meta property="og:description" content="MySlowBody · MyFidget · MySlowSleep">
<meta property="og:image" content="https://mystudioapps.com/assets/myslowbody/icon.png">
<!-- 짧은 링크(2026-10-03 사용자: 깔끔한 링크) — mystudioapps.com/yt-en → 홈페이지(2026-10-08 사용자: 여러 앱이 같이 쓰는 프로필 링크는 그냥 홈페이지로)에 언어·꼬리표 yt_en 를 붙여 넘긴다(myslowbody/index.html). -->
<meta http-equiv="refresh" content="0; url=/?lang=en&c=yt_en">
<meta name="color-scheme" content="light dark">
<style>
  /* 이동 중 화면과 같은 배경·같은 자리의 아이콘(2026-10-07) — 넘어가는 동안 튀거나 파란 링크만 보이지 않게. */
  :root { --bg: #F3F6F2; --ink: #13201A; --line: #D8E1D7; --surface: #FFFFFF; --green: #1E8E4E; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0E110D; --ink: #F1F3EE; --line: #2C332B; --surface: #191D18; --green: #43D873; } }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Hiragino Sans", sans-serif; }
  .wrap { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; align-items: center; padding: 26vh 24px 40px; padding-top: 26svh; }
  .icon { width: 88px; height: 88px; border-radius: 22px; display: block; box-shadow: 0 6px 20px rgba(0, 0, 0, .12); }
  .btn { margin-top: 22px; display: block; padding: 13px 22px; border-radius: 14px; text-decoration: none; font-weight: 700; color: var(--ink); background: var(--surface); border: 1px solid var(--line); }
</style>
<script>location.replace('/?lang=en&c=yt_en');</script>
</head>
<body><main class="wrap"><img class="icon" src="/assets/apple-touch-icon.png" alt="MyStudio" width="88" height="88"><noscript><a class="btn" href="/?lang=en&c=yt_en">MyStudio</a></noscript></main></body>
</html>
